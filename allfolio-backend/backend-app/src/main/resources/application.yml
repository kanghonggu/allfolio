server:
  port: 8090
  error:
    include-message: never
    include-exception: false
    include-binding-errors: never
  tomcat:
    # Virtual Thread 환경에서는 증가 가능 (Java 21)
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 10000

spring:
  application:
    name: allfolio-backend
  main:
    web-application-type: servlet   # webflux 의존성 추가 시 servlet 타입 명시

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/allfolio?reWriteBatchedInserts=true&prepareThreshold=5}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

    # ── HikariCP ────────────────────────────────────────────────────────────
    # 이 블록은 2026-08-11까지 `spring.hikari`에 있었다. 바인딩 prefix는
    # `spring.datasource.hikari`이므로 전량 무시됐고, 운영은 줄곧 HikariCP
    # 기본값으로 돌았다(pool 10 / connection-timeout 30s / keepalive off).
    # 위치를 바로잡으면서, 한 번도 적용된 적 없는 기존 값을 그대로 켜는 대신
    # "실제로 돌아가던 값"을 기준으로 재산정했다.
    #
    # 환경 전제:
    #   앱 — Render 무료 플랜 단일 인스턴스(0.1 vCPU). k6 실측 처리량 상한 ~20 req/s
    #   DB — Neon 무료 플랜(0.25 CU). max_connections ~104(사용가능 ~97),
    #        5분 유휴 시 scale-to-zero(무료 플랜은 해제 불가), 월 컴퓨트 시간 제한
    #
    # 로컬 도커 Postgres와 운영 Neon에 같은 값을 쓴다. 아래 값은 scale-to-zero가
    # 있는 쪽에 맞춘 보수적 설정이고 로컬에서도 해가 없어, 프로파일을 나눠
    # 두 벌을 동기화하는 비용이 이득보다 크다고 판단했다.
    hikari:
      pool-name: allfolio-pool

      # 기존 주석은 "8 vCPU 기준 16~20"을 근거로 삼았으나 실제 인스턴스는 0.1 vCPU다.
      # 지금까지 문제 없이 돌아온 실효값 10을 유지한다. Neon 가용 커넥션 ~97 중
      # 10개면 배치·어드민·psql 몫을 남기면서 ~20 req/s를 감당하기 충분하다.
      maximum-pool-size: 10
      minimum-idle: 10              # = maximum-pool-size (고정 크기 풀 — HikariCP 권장)

      # 풀에서 커넥션을 얻기까지의 최대 대기 시간. TCP connect 타임아웃이 아니라
      # 대기열 대기까지 포함한다. 기존에 적혀 있던 5초는 위험하다:
      #   - Neon 문서 권고 connect timeout이 10~15초 (scale-to-zero 복귀 포함)
      #   - 자정 배치가 @Transactional 안에서 KIS/Binance HTTP를 호출하며 커넥션을
      #     붙들어 일시적 풀 경합이 생긴다 → 5초면 사용자 요청이 바로 500으로 떨어진다
      # 지금까지 실제 적용돼 있던 30초를 유지한다.
      connection-timeout: 30000     # 30초

      # minimum-idle == maximum-pool-size인 동안에는 동작하지 않는다(HikariCP 사양).
      # 고정 풀 정책을 바꿀 때를 위해 기본값을 명시만 해 둔다.
      idle-timeout: 600000          # 10분

      max-lifetime: 1800000         # 30분

      # keepalive는 끈 채로 둔다(0 = 비활성).
      # 30초 주기 ping은 Neon의 5분 scale-to-zero를 영구히 무력화해 무료 플랜의
      # 월 컴퓨트 시간을 소진시킨다. 유휴 중 서버가 끊은 커넥션은 HikariCP가
      # 대여 시점 유효성 검사로 걸러내므로 keepalive 없이도 안전하다.
      keepalive-time: 0

      # connection-test-query는 의도적으로 두지 않는다. JDBC4 드라이버(PostgreSQL)는
      # Connection.isValid()를 지원하므로 HikariCP 공식 권고대로 설정하지 않는 편이
      # 빠르고, 설정하면 경고 로그가 남는다.

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # timeout = Lettuce command timeout이자 첫 연결 핸드셰이크(HELLO) 타임아웃.
      # 300ms는 콜드 부트(0.1 CPU) 직후 첫 연결이 항상 실패해 PositionCacheInitializer가 죽었음.
      # connect-timeout은 TCP 연결 단계에만 적용되므로 timeout 자체를 충분히 잡아야 함.
      timeout: ${REDIS_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:10s}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false               # OSIV 비활성화 — 커넥션 조기 반환
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

        # Batch INSERT 전략 (trade_raw, position_daily 대량 저장)
        jdbc:
          batch_size: 500
          batch_versioned_data: true
        order_inserts: true           # batch INSERT 시 같은 테이블 묶기
        order_updates: true

        # 2차 캐시 비활성화 (멀티테넌트 환경에서 캐시 오염 방지)
        cache:
          use_second_level_cache: false
          use_query_cache: false

        # 통계 (부하 테스트 시 활성화하여 slow query 추적)
        generate_statistics: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Kafka (optional — kafka.enabled=true 시 consumer/producer 활성화)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false   # Kafka 없는 로컬 환경에서 시작 실패 방지
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        batch.size: 16384
        delivery.timeout.ms: 30000
    consumer:
      group-id: allfolio-dlq
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50

kafka:
  enabled: false   # true로 변경 시 Kafka consumer/producer/topic 활성화

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:}

allfolio:
  auth:
    jwt-secret: ${ALLFOLIO_JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    # refresh 쿠키 Secure 플래그 — 운영 기본 true, http 로컬 테스트 시에만 false
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  dlq:
    redis-worker-enabled: ${DLQ_REDIS_WORKER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,hikaricp,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    kafka:
      enabled: false   # Kafka 없는 로컬 환경에서 health 500 방지
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: allfolio-backend

fsc:
  api-key: ${FSC_API_KEY:}

unified-asset:
  moralis:
    api-key: ${MORALIS_API_KEY:}

binance:
  api-key: ${BINANCE_API_KEY:}
  secret-key: ${BINANCE_API_SECRET:}
  base-url: ${BINANCE_API_BASE_URL:https://api.binance.com}   # 테스트넷은 BINANCE_API_BASE_URL로 덮는다
  tenant-id: ${BINANCE_TENANT_ID:ffff0000-0000-0000-0000-000000000001}
  portfolio-id: ${BINANCE_PORTFOLIO_ID:dddd0000-0000-0000-0000-000000000001}
  symbols: BTCUSDT,ETHUSDT
  ws-enabled: ${BINANCE_WS_ENABLED:false}  # WebSocket 시세 수신 활성화 여부

toss:
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  base-url: https://openapi.toss.im
  redirect-uri: ${TOSS_REDIRECT_URI:http://localhost:8090/api/broker/toss/callback}

samsung:
  app-key: ${SAMSUNG_APP_KEY:}
  app-secret: ${SAMSUNG_APP_SECRET:}
  base-url: https://openapi.samsungpop.com
  redirect-uri: ${SAMSUNG_REDIRECT_URI:http://localhost:8090/api/broker/samsung/callback}

# 한국투자증권 (KIS) Open API
kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
  ws-url: ${KIS_WS_URL:wss://ops.koreainvestment.com:21000}
  mock: ${KIS_MOCK:false}           # true = 모의투자 환경
  ws-enabled: ${KIS_WS_ENABLED:false}
  symbols: ${KIS_SYMBOLS:}          # 실시간 구독 종목 ex) 005930,000660

# 시장 화면 노출 — AF-104
#
# indices-enabled는 AF-108 재배포 검토의 미결 때문에 있다. KIS 개인용 오픈API의 시세 재배포
# 가능 여부가 확정되지 않았다(원문 미확보). 답이 "불가"로 오면 이 값을 false로 바꾸는 것만으로
# 지수 두 탭이 화면에서 사라진다 — 서버가 응답에 아예 안 싣고, 조회조차 하지 않는다.
# 아래 market-index(수집 대상)와는 다른 설정이다. 이건 노출만 끄는 스위치라 off로 둬도
# 수집은 계속 돈다 — 수집까지 멈추려면 GitHub Actions cron 쪽을 따로 손봐야 한다.
market:
  indices-enabled: ${MARKET_INDICES_ENABLED:true}

# 지수 수집 — AF-101
# 코드를 소스에 박지 않는 이유: KIS 공식 샘플이 문서화한 FID_INPUT_ISCD는
# 0001(코스피)·1001(코스닥)·2001(코스피200) 셋뿐이다. KOSDAQ150·KRX300은 확인되지 않았고,
# 추측한 코드를 넣으면 KIS가 오류를 주거나 — 더 나쁘게 — 엉뚱한 업종 지수를 조용히 돌려준다.
# 코드가 확인되는 대로 여기 한 줄씩 추가한다.
# 국내 지수 수집 대상 (AF-101 · AF-111)
#
# **kis-iscd의 1차 출처는 KIS 지수코드 마스터다** — 웹 검색이나 추측이 아니다.
#   https://new.real.download.dws.co.kr/common/master/idxcode.mst.zip
#   (KIS 공식 저장소 stocks_info/sector_code.py가 쓰는 그 파일. cp949 고정폭, 코드 = row[1:5])
# 이미 검증된 0001·1001·2001이 그 파일에서 종합·KOSDAQ·KOSPI200으로 나오는 걸 확인한 뒤
# 같은 규칙으로 나머지 둘을 읽었다.
#
# **추측해서 넣으면 안 된다.** IndexGuards는 값끼리의 정합성만 보므로(등락률이 현재가·전일대비와
# 맞는지) 엉뚱한 업종 지수를 받아도 그 응답은 내부적으로 일관돼 가드를 그대로 통과한다.
# 틀린 코드는 예외도 경고도 없이 그럴듯한 숫자로 저장된다.
#
# 파생상품과 한 글자 차이다 — 마스터 파일에서 함께 나온 것들:
#   KOSDAQ150: 3003 KSQ150 / 3004 동일가중 / 3005 레버리지 / 3006~ 선물·인버스 / 3197 TR
#   KRX300:    4300 KRX 300 / 4198 TR / 4304 선물 / 4305 레버리지 / 4351~ 업종별
# 기본 지수가 아닌 걸 넣으면 화면에 레버리지 지수가 "KRX300"이라고 뜬다.
market-index:
  domestic:
    - code: KOSPI
      kis-iscd: "0001"
    - code: KOSDAQ
      kis-iscd: "1001"
    - code: KOSPI200
      kis-iscd: "2001"
    - code: KOSDAQ150
      kis-iscd: "3003"
    - code: KRX300
      kis-iscd: "4300"

  # 해외 지수 — AF-110. 코드는 KIS 마스터(frgn_code.mst)에서 1차 확인했다.
  # nameContains는 장식이 아니다 — 틀린 코드는 가드를 통과해 그럴듯한 숫자로 저장되므로
  # KIS가 돌려준 hts_kor_isnm과 대조하는 것이 유일한 방어다.
  # ✅ 실측 확인: SPX · .DJI · HK#HS. 나머지 여섯은 마스터에서 읽었을 뿐이므로
  #    배포 후 raw-overseas로 hts_kor_isnm을 대조할 것.
  #
  # close-local-time은 zone-id 기준 현지 마감 시각이다. 이게 없으면 봉 날짜만 보게 되어
  # **평일 정상 수집 전건이 확정 종가를 `장중`으로 저장한다** — 아시아 슬롯(08:30 UTC)은
  # 홍콩 16:30, 미국 슬롯(21:30 UTC)은 뉴욕 17:30으로 둘 다 마감 이후이기 때문이다.
  # 현지 시각으로 적으므로 서머타임은 zone-id가 알아서 맞춘다(유로스톡스 17:30은 UTC로
  # 여름 15:30·겨울 16:30을 오가지만 현지로는 그대로다).
  # **근사치다** — 반일장·특별휴장·거래소 개편(도쿄 2024-11 15:00→15:30)까지 따라가지 않는다.
  # 예약 실행은 전부 마감 한참 뒤라(가장 빠듯한 홍콩도 30분) 몇 분 오차로 판정이 뒤집히지 않는다.
  overseas:
    - { code: SPX,       kis-iscd: "SPX",       zone-id: America/New_York, schedule: US,   name-contains: "S&P500",       close-local-time: "16:00" }
    - { code: NASDAQ,    kis-iscd: "COMP",      zone-id: America/New_York, schedule: US,   name-contains: "나스닥 종합",   close-local-time: "16:00" }
    # 다우존스(.DJI)는 옆에 .DJT(운송)·.DJU(유틸리티)가 붙어 있다 — 한 글자 차이.
    # "다우존스"만으로는 그 둘도 통과하므로 "산업"까지 요구한다.
    - { code: DOW,       kis-iscd: ".DJI",      zone-id: America/New_York, schedule: US,   name-contains: "다우존스 산업", close-local-time: "16:00" }
    - { code: NASDAQ100, kis-iscd: "NDX",       zone-id: America/New_York, schedule: US,   name-contains: "나스닥 100",    close-local-time: "16:00" }
    - { code: VIX,       kis-iscd: "VIX",       zone-id: America/New_York, schedule: US,   name-contains: "VIX",          close-local-time: "16:00" }
    # STOXX50의 schedule이 US인 것은 오타가 아니다. 마감은 현지 17:30(CEST 서머타임 기준)이며
    # UTC로는 서머타임이면 15:30, 표준시(CET, 겨울)면 16:30이다 — 계절에 따라 15:30~16:30 UTC를
    # 오간다. 어느 쪽이든 아시아 슬롯(08:30 UTC)보다 늦어 거기 두면 늘 전일 종가를 받는다.
    # 미국 슬롯(21:30 UTC)은 두 계절 모두 마감 이후라 US 슬롯 결정 자체는 연중 유효하다.
    # zone-id는 여전히 유럽이다(진행 중인 봉 판별용, 수집 시각과는 별개).
    - { code: STOXX50,   kis-iscd: "SX5E",      zone-id: Europe/Berlin,    schedule: US,   name-contains: "유로STOXX50",  close-local-time: "17:30" }
    - { code: NIKKEI225, kis-iscd: "JP#NI225",  zone-id: Asia/Tokyo,       schedule: ASIA, name-contains: "니케이 225",    close-local-time: "15:30" }
    # 항셍 옆에 HSCE(홍콩H)·HK#HSSI(소형주)가 붙어 있다 — 코드가 아니라 이름으로 잡는다.
    # "항셍"만으로는 소형주지수도 통과하므로 "항셍지수"를 통째로 요구한다.
    - { code: HANGSENG,  kis-iscd: "HK#HS",     zone-id: Asia/Hong_Kong,   schedule: ASIA, name-contains: "항셍지수",      close-local-time: "16:00" }
    # 상해(SHANG) 옆에 CH#SHA/CH#SHB(A·B주)가 붙어 있다. "상해"만으로는 A·B주도 통과한다.
    - { code: SHANGHAI,  kis-iscd: "SHANG",     zone-id: Asia/Shanghai,    schedule: ASIA, name-contains: "상해종합",      close-local-time: "15:00" }
    # ✅ 위 name-contains는 **2026-08-13 첫 운영 수집의 실측값으로 좁힌 것**이다. 그 전에는
    # 마스터 파일 추정이라 넷이 약했다(NASDAQ·NASDAQ100이 둘 다 "나스닥", DOW의 "다우존스"가
    # .DJT/.DJU와 접두사 공유, "상해"가 A·B주에도 포함, "STOXX"가 STOXX 계열과 겹침).
    # 9종 실측 응답(hts_kor_isnm):
    #   S&P500 / 나스닥 종합 / 다우존스 산업지수 / 나스닥 100 / VIX 지수 /
    #   유로STOXX50 / 일본니케이 225지수 / 항셍지수 / 중국상해종합지수
    # 값이 아니라 **부분 문자열**을 넣는 이유: KIS가 이름에 접두사("일본"·"중국")나 표기를
    # 조금 바꿔도 수집이 멈추지 않게 하되, 옆 종목과는 갈리는 지점까지만 좁힌다.
    # 다시 넓히지 말 것 — 넓히면 코드 오선택이 무증상으로 저장된다.

# 금리 수집 대상 (AF-102)
#
# **아래 코드는 전부 2026-08-13에 GET /api/admin/rate/ecos/tables·/ecos/items 로 실제 확인한 값이다.**
# 추정해서 고치지 말 것 — ECOS는 틀린 코드에 오류가 아니라 0건을 돌려주므로,
# 잘못 넣으면 "코드가 틀렸는지 기간이 빈 건지"를 구분할 방법이 없다.
# 바꿔야 하면 같은 엔드포인트로 다시 확인하고, 확인한 이름을 아래처럼 주석에 남긴다.
#
# 통계표는 둘뿐이다:
#   817Y002 = 시장금리(일별)              — 주기 D
#   722Y001 = 한국은행 기준금리 및 여수신금리 — 주기 D (A·M·Q도 있지만 우리는 D만 쓴다)
#
# **한 자리 차이로 다른 만기가 되는 항목이 있다.** 특히 국고채가 그렇다:
#   010200000 = 국고채(3년)   ← 우리가 쓰는 것
#   010200001 = 국고채(5년)   ← 마지막 자리만 다르다
# 잘못 넣어도 값은 그럴듯해서 차트가 이상해질 때까지 아무도 눈치채지 못한다.
#
# 이름이 비슷해 골라야 했던 것들(선택 근거를 남긴다):
#   콜금리   → 010101000 전체거래 (중개회사거래 010102000 / 은행증권금융차입 010103000 아님)
#   회사채   → 010300000 AA- 3년  (민평 010310000 / BBB- 010320000 아님)
market-rate:
  ecos:
    - code: BASE_RATE          # 한국은행 기준금리
      stat-code: "722Y001"
      item-code: "0101000"
      cycle: D
    - code: CALL_ON            # 콜금리(1일, 전체거래)
      stat-code: "817Y002"
      item-code: "010101000"
      cycle: D
    - code: CD_91D             # CD(91일)
      stat-code: "817Y002"
      item-code: "010502000"
      cycle: D
    - code: KTB_3Y             # 국고채(3년) — 010200001은 5년이다. 위 주석 참조
      stat-code: "817Y002"
      item-code: "010200000"
      cycle: D
    - code: KTB_10Y            # 국고채(10년)
      stat-code: "817Y002"
      item-code: "010210000"
      cycle: D
    - code: CORP_AA3Y          # 회사채(3년, AA-)
      stat-code: "817Y002"
      item-code: "010300000"
      cycle: D

  # 미국 금리 — FRED(세인트루이스 연은). 시리즈 ID는 FRED 문서 기준이며 배포 후 실호출로 확인한다.
  #
  # T10Y2Y(10년-2년 스프레드)는 **일부러 안 받는다** — UST_10Y - UST_2Y로 조회 시 계산한다.
  # 저장해 두면 어느 날 둘이 어긋났을 때 어느 쪽이 맞는지 가릴 방법이 없다.
  # 한·미 기준금리차(BASE_RATE - US_FFR)도 같은 이유로 저장하지 않는다.
  #
  # **미국 값은 한국 시각으로 하루 늦다.** 크론이 평일 KST 18:10 한 번 돌아 두 나라를 함께 긁는데,
  # 그 시각의 최신 미국 관측은 직전 미국 영업일이다. 항목마다 자기 quoteDate를 달고 나가므로
  # 화면이 거짓말을 하지는 않는다 — 이걸 고치려고 크론을 늘리지 말 것.
  fred:
    - { code: US_FFR,  series-id: DFF }
    - { code: UST_2Y,  series-id: DGS2 }
    - { code: UST_10Y, series-id: DGS10 }
    - { code: UST_30Y, series-id: DGS30 }

# 암호화폐 거래소 WebSocket (국내)
upbit:
  ws-enabled: ${UPBIT_WS_ENABLED:false}
  symbols: ${UPBIT_SYMBOLS:KRW-BTC,KRW-ETH}

bithumb:
  ws-enabled: ${BITHUMB_WS_ENABLED:false}
  symbols: ${BITHUMB_SYMBOLS:BTC_KRW,ETH_KRW}

coinone:
  ws-enabled: ${COINONE_WS_ENABLED:false}
  symbols: ${COINONE_SYMBOLS:BTC,ETH}

# 암호화폐 거래소 WebSocket (해외)
bybit:
  ws-enabled: ${BYBIT_WS_ENABLED:false}
  symbols: ${BYBIT_SYMBOLS:BTCUSDT,ETHUSDT}

okx:
  ws-enabled: ${OKX_WS_ENABLED:false}
  symbols: ${OKX_SYMBOLS:BTC-USDT,ETH-USDT}

# 외부 스케줄러(GitHub Actions) 트리거 토큰 — AF-103
# 비어 있으면 /api/internal/scheduler/** 가 503으로 닫힌다. 빈 값이 "토큰 불필요"가 되면
# 환경변수를 빠뜨린 순간 엔드포인트가 완전 공개되므로, 설정 누락의 기본값은 "닫힘"이다.
scheduler:
  trigger-token: ${SCHEDULER_TOKEN:}

# 마감 워크플로우 인프로세스 자정 스케줄러 — 기본 off
# Render 무료 웹 서비스는 15분 유휴 시 잠들어 자정에는 인스턴스가 자고 있고, 잠든 인스턴스는
# @Scheduled를 못 뛴다(운영 로그상 6일 중 4일 미실행). 유료 플랜으로 올려 인스턴스가 상주하게
# 되면 그때 켜면 된다 — 그 전까지는 켜 봐야 안 뜨거나 외부 트리거와 겹쳐 돌 뿐이다.
closing:
  scheduler:
    enabled: false   # GitHub Actions 크론이 대신한다 — .github/workflows/closing.yml

# FX 환율 자동 수집
fx:
  scheduler:
    enabled: ${FX_SCHEDULER_ENABLED:true}    # ExchangeFxApiClient + FxRateScheduler 활성화
    delay-ms: 60000                          # 갱신 주기 (ms). RedisFxRateService의 TTL이 이 값의 3배다
  # KRW 시세 소스 (USDT·BTC·ETH). Upbit 우선, 실패 시 Bithumb.
  # 두 거래소 모두 한 요청으로 세 마켓을 주므로 심볼이 늘어도 호출 수는 그대로다.
  # Binance는 한국 철수 후 KRW 마켓이 없어 쓸 수 없다 — USDTKRW·USDKRW 모두 -1121 Invalid symbol.
  exchange:
    upbit-base-url: ${UPBIT_FX_BASE_URL:https://api.upbit.com}
    bithumb-base-url: ${BITHUMB_FX_BASE_URL:https://api.bithumb.com}
  usdt-krw:
    # 수집이 3주기 연속 실패했을 때만 쓰이는 최후 상수. 상수인 이상 반드시 어긋나므로
    # 이 값이 실제로 쓰이고 있다면 [FxScheduler] 로그를 먼저 봐야 한다.
    fallback-rate: ${FX_USDT_KRW_FALLBACK:1400}
  # 코인(BTC·ETH)에는 폴백 상수를 두지 않는다. 갱신 주체가 없는 상수는 반드시 어긋나고
  # 조용히 평가에 들어간다 — ETH가 4,500,000으로 박혀 실제 2,663,000 대비 69% 과대평가였다.
  # 값이 없으면 RedisFxRateService가 예외를 던진다. 코인 키의 TTL은 24시간이다.

# ECOS(한국은행) 과거 환율 시계열 — AF-100
# stat-code/item-code는 ECOS 사이트에서 확인한 값을 환경변수로 넣는다. 비어 있으면 백필만 실패하고
# 조회는 현재 환율 폴백으로 떨어지므로 서비스는 정상 동작한다.
ecos:
  api-key: ${ECOS_API_KEY:}
  base-url: ${ECOS_BASE_URL:https://ecos.bok.or.kr}
  # 통화를 추가하려면 이 YAML을 고쳐야 한다 — 대문자 맵 키는 환경변수로 표현할 수 없다.
  # 그리고 여기만 고치면 백필은 되는데 조회가 안 된다:
  # UnifiedAssetFxConverterAdapter.HISTORICAL 집합에도 같은 통화를 넣어야 한다.
  # (ECOS_SERIES_JPY_STAT_CODE는 relaxed binding을 거치며 ecos.series.jpy.*로 소문자화된다.)
  # unit-divisor는 고시 단위를 1단위로 되돌리는 제수다. JPY는 100엔 고시라 100. 0 이하면 기동이 실패한다.
  series:
    USD:
      stat-code: ${ECOS_USD_STAT_CODE:}
      item-code: ${ECOS_USD_ITEM_CODE:}
      unit-divisor: 1

# FRED(세인트루이스 연은) 미국 금리 — 수집 대상은 위 market-rate.fred에 있다.
# **인증키가 쿼리 파라미터(api_key=)에 실린다.** ECOS는 경로 첫 세그먼트인데 FRED는 쿼리라,
# 위치만 다르고 노출 위험은 같다 — 전체 URL을 로그에 찍지 말 것(FredApiClient가 그 방어를 한다).
# 비어 있으면 미국 금리만 NO_KEY로 실패하고 나머지 수집·조회는 정상이다.
fred:
  api-key: ${FRED_API_KEY:}
  base-url: ${FRED_BASE_URL:https://api.stlouisfed.org}

logging:
  level:
    root: INFO
    com.allfolio: INFO
    org.hibernate.SQL: OFF
    com.zaxxer.hikari: INFO

---
# 부하 테스트 프로파일
spring:
  config:
    activate:
      on-profile: load-test
  jpa:
    properties:
      hibernate:
        generate_statistics: true   # 부하 테스트 시 쿼리 통계 활성화
logging:
  level:
    com.zaxxer.hikari: DEBUG        # 커넥션 풀 상태 추적
    org.hibernate.stat: DEBUG       # Hibernate 통계
