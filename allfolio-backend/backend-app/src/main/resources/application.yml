server:
  port: 8090
  error:
    include-message: never
    include-exception: false
    include-binding-errors: never
  tomcat:
    # Virtual Thread 환경에서는 증가 가능 (Java 21)
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    connection-timeout: 10000

spring:
  application:
    name: allfolio-backend
  main:
    web-application-type: servlet   # webflux 의존성 추가 시 servlet 타입 명시

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/allfolio?reWriteBatchedInserts=true&prepareThreshold=5}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

    # ── HikariCP ────────────────────────────────────────────────────────────
    # 이 블록은 2026-08-11까지 `spring.hikari`에 있었다. 바인딩 prefix는
    # `spring.datasource.hikari`이므로 전량 무시됐고, 운영은 줄곧 HikariCP
    # 기본값으로 돌았다(pool 10 / connection-timeout 30s / keepalive off).
    # 위치를 바로잡으면서, 한 번도 적용된 적 없는 기존 값을 그대로 켜는 대신
    # "실제로 돌아가던 값"을 기준으로 재산정했다.
    #
    # 환경 전제:
    #   앱 — Render 무료 플랜 단일 인스턴스(0.1 vCPU). k6 실측 처리량 상한 ~20 req/s
    #   DB — Neon 무료 플랜(0.25 CU). max_connections ~104(사용가능 ~97),
    #        5분 유휴 시 scale-to-zero(무료 플랜은 해제 불가), 월 컴퓨트 시간 제한
    #
    # 로컬 도커 Postgres와 운영 Neon에 같은 값을 쓴다. 아래 값은 scale-to-zero가
    # 있는 쪽에 맞춘 보수적 설정이고 로컬에서도 해가 없어, 프로파일을 나눠
    # 두 벌을 동기화하는 비용이 이득보다 크다고 판단했다.
    hikari:
      pool-name: allfolio-pool

      # 기존 주석은 "8 vCPU 기준 16~20"을 근거로 삼았으나 실제 인스턴스는 0.1 vCPU다.
      # 지금까지 문제 없이 돌아온 실효값 10을 유지한다. Neon 가용 커넥션 ~97 중
      # 10개면 배치·어드민·psql 몫을 남기면서 ~20 req/s를 감당하기 충분하다.
      maximum-pool-size: 10
      minimum-idle: 10              # = maximum-pool-size (고정 크기 풀 — HikariCP 권장)

      # 풀에서 커넥션을 얻기까지의 최대 대기 시간. TCP connect 타임아웃이 아니라
      # 대기열 대기까지 포함한다. 기존에 적혀 있던 5초는 위험하다:
      #   - Neon 문서 권고 connect timeout이 10~15초 (scale-to-zero 복귀 포함)
      #   - 자정 배치가 @Transactional 안에서 KIS/Binance HTTP를 호출하며 커넥션을
      #     붙들어 일시적 풀 경합이 생긴다 → 5초면 사용자 요청이 바로 500으로 떨어진다
      # 지금까지 실제 적용돼 있던 30초를 유지한다.
      connection-timeout: 30000     # 30초

      # minimum-idle == maximum-pool-size인 동안에는 동작하지 않는다(HikariCP 사양).
      # 고정 풀 정책을 바꿀 때를 위해 기본값을 명시만 해 둔다.
      idle-timeout: 600000          # 10분

      max-lifetime: 1800000         # 30분

      # keepalive는 끈 채로 둔다(0 = 비활성).
      # 30초 주기 ping은 Neon의 5분 scale-to-zero를 영구히 무력화해 무료 플랜의
      # 월 컴퓨트 시간을 소진시킨다. 유휴 중 서버가 끊은 커넥션은 HikariCP가
      # 대여 시점 유효성 검사로 걸러내므로 keepalive 없이도 안전하다.
      keepalive-time: 0

      # connection-test-query는 의도적으로 두지 않는다. JDBC4 드라이버(PostgreSQL)는
      # Connection.isValid()를 지원하므로 HikariCP 공식 권고대로 설정하지 않는 편이
      # 빠르고, 설정하면 경고 로그가 남는다.

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # timeout = Lettuce command timeout이자 첫 연결 핸드셰이크(HELLO) 타임아웃.
      # 300ms는 콜드 부트(0.1 CPU) 직후 첫 연결이 항상 실패해 PositionCacheInitializer가 죽었음.
      # connect-timeout은 TCP 연결 단계에만 적용되므로 timeout 자체를 충분히 잡아야 함.
      timeout: ${REDIS_TIMEOUT:3s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:10s}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false               # OSIV 비활성화 — 커넥션 조기 반환
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

        # Batch INSERT 전략 (trade_raw, position_daily 대량 저장)
        jdbc:
          batch_size: 500
          batch_versioned_data: true
        order_inserts: true           # batch INSERT 시 같은 테이블 묶기
        order_updates: true

        # 2차 캐시 비활성화 (멀티테넌트 환경에서 캐시 오염 방지)
        cache:
          use_second_level_cache: false
          use_query_cache: false

        # 통계 (부하 테스트 시 활성화하여 slow query 추적)
        generate_statistics: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Kafka (optional — kafka.enabled=true 시 consumer/producer 활성화)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false   # Kafka 없는 로컬 환경에서 시작 실패 방지
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        batch.size: 16384
        delivery.timeout.ms: 30000
    consumer:
      group-id: allfolio-dlq
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50

kafka:
  enabled: false   # true로 변경 시 Kafka consumer/producer/topic 활성화

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:}

allfolio:
  auth:
    jwt-secret: ${ALLFOLIO_JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    # refresh 쿠키 Secure 플래그 — 운영 기본 true, http 로컬 테스트 시에만 false
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  dlq:
    redis-worker-enabled: ${DLQ_REDIS_WORKER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,hikaricp,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    kafka:
      enabled: false   # Kafka 없는 로컬 환경에서 health 500 방지
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: allfolio-backend

fsc:
  api-key: ${FSC_API_KEY:}

unified-asset:
  moralis:
    api-key: ${MORALIS_API_KEY:}

binance:
  api-key: ${BINANCE_API_KEY:}
  secret-key: ${BINANCE_API_SECRET:}
  base-url: ${BINANCE_API_BASE_URL:https://api.binance.com}   # 테스트넷은 BINANCE_API_BASE_URL로 덮는다
  tenant-id: ${BINANCE_TENANT_ID:ffff0000-0000-0000-0000-000000000001}
  portfolio-id: ${BINANCE_PORTFOLIO_ID:dddd0000-0000-0000-0000-000000000001}
  symbols: BTCUSDT,ETHUSDT
  ws-enabled: ${BINANCE_WS_ENABLED:false}  # WebSocket 시세 수신 활성화 여부

toss:
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  base-url: https://openapi.toss.im
  redirect-uri: ${TOSS_REDIRECT_URI:http://localhost:8090/api/broker/toss/callback}

samsung:
  app-key: ${SAMSUNG_APP_KEY:}
  app-secret: ${SAMSUNG_APP_SECRET:}
  base-url: https://openapi.samsungpop.com
  redirect-uri: ${SAMSUNG_REDIRECT_URI:http://localhost:8090/api/broker/samsung/callback}

# 한국투자증권 (KIS) Open API
kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
  ws-url: ${KIS_WS_URL:wss://ops.koreainvestment.com:21000}
  mock: ${KIS_MOCK:false}           # true = 모의투자 환경
  ws-enabled: ${KIS_WS_ENABLED:false}
  symbols: ${KIS_SYMBOLS:}          # 실시간 구독 종목 ex) 005930,000660

# 지수 수집 — AF-101
# 코드를 소스에 박지 않는 이유: KIS 공식 샘플이 문서화한 FID_INPUT_ISCD는
# 0001(코스피)·1001(코스닥)·2001(코스피200) 셋뿐이다. KOSDAQ150·KRX300은 확인되지 않았고,
# 추측한 코드를 넣으면 KIS가 오류를 주거나 — 더 나쁘게 — 엉뚱한 업종 지수를 조용히 돌려준다.
# 코드가 확인되는 대로 여기 한 줄씩 추가한다.
market-index:
  domestic:
    - code: KOSPI
      kis-iscd: "0001"
    - code: KOSDAQ
      kis-iscd: "1001"
    - code: KOSPI200
      kis-iscd: "2001"

# 암호화폐 거래소 WebSocket (국내)
upbit:
  ws-enabled: ${UPBIT_WS_ENABLED:false}
  symbols: ${UPBIT_SYMBOLS:KRW-BTC,KRW-ETH}

bithumb:
  ws-enabled: ${BITHUMB_WS_ENABLED:false}
  symbols: ${BITHUMB_SYMBOLS:BTC_KRW,ETH_KRW}

coinone:
  ws-enabled: ${COINONE_WS_ENABLED:false}
  symbols: ${COINONE_SYMBOLS:BTC,ETH}

# 암호화폐 거래소 WebSocket (해외)
bybit:
  ws-enabled: ${BYBIT_WS_ENABLED:false}
  symbols: ${BYBIT_SYMBOLS:BTCUSDT,ETHUSDT}

okx:
  ws-enabled: ${OKX_WS_ENABLED:false}
  symbols: ${OKX_SYMBOLS:BTC-USDT,ETH-USDT}

# 외부 스케줄러(GitHub Actions) 트리거 토큰 — AF-103
# 비어 있으면 /api/internal/scheduler/** 가 503으로 닫힌다. 빈 값이 "토큰 불필요"가 되면
# 환경변수를 빠뜨린 순간 엔드포인트가 완전 공개되므로, 설정 누락의 기본값은 "닫힘"이다.
scheduler:
  trigger-token: ${SCHEDULER_TOKEN:}

# FX 환율 자동 수집
fx:
  scheduler:
    enabled: ${FX_SCHEDULER_ENABLED:true}    # ExchangeFxApiClient + FxRateScheduler 활성화
    delay-ms: 60000                          # 갱신 주기 (ms). RedisFxRateService의 TTL이 이 값의 3배다
  # USDT/KRW 시세 소스. Upbit 우선, 실패 시 Bithumb.
  # Binance는 한국 철수 후 KRW 마켓이 없어 쓸 수 없다 — USDTKRW·USDKRW 모두 -1121 Invalid symbol.
  exchange:
    upbit-base-url: ${UPBIT_FX_BASE_URL:https://api.upbit.com}
    bithumb-base-url: ${BITHUMB_FX_BASE_URL:https://api.bithumb.com}
  usdt-krw:
    # 수집이 3주기 연속 실패했을 때만 쓰이는 최후 상수. 상수인 이상 반드시 어긋나므로
    # 이 값이 실제로 쓰이고 있다면 [FxScheduler] 로그를 먼저 봐야 한다.
    fallback-rate: ${FX_USDT_KRW_FALLBACK:1400}
  # 코인 KRW 시세 폴백 (QA P3) — 라이브 피드 없을 때 어드민 PUT /api/admin/fx/crypto/{symbol}로 갱신
  btc-krw:
    fallback-rate: ${FX_BTC_KRW_FALLBACK:90000000}
  eth-krw:
    fallback-rate: ${FX_ETH_KRW_FALLBACK:4500000}

# ECOS(한국은행) 과거 환율 시계열 — AF-100
# stat-code/item-code는 ECOS 사이트에서 확인한 값을 환경변수로 넣는다. 비어 있으면 백필만 실패하고
# 조회는 현재 환율 폴백으로 떨어지므로 서비스는 정상 동작한다.
ecos:
  api-key: ${ECOS_API_KEY:}
  base-url: ${ECOS_BASE_URL:https://ecos.bok.or.kr}
  # 통화를 추가하려면 이 YAML을 고쳐야 한다 — 대문자 맵 키는 환경변수로 표현할 수 없다.
  # 그리고 여기만 고치면 백필은 되는데 조회가 안 된다:
  # UnifiedAssetFxConverterAdapter.HISTORICAL 집합에도 같은 통화를 넣어야 한다.
  # (ECOS_SERIES_JPY_STAT_CODE는 relaxed binding을 거치며 ecos.series.jpy.*로 소문자화된다.)
  # unit-divisor는 고시 단위를 1단위로 되돌리는 제수다. JPY는 100엔 고시라 100. 0 이하면 기동이 실패한다.
  series:
    USD:
      stat-code: ${ECOS_USD_STAT_CODE:}
      item-code: ${ECOS_USD_ITEM_CODE:}
      unit-divisor: 1

logging:
  level:
    root: INFO
    com.allfolio: INFO
    org.hibernate.SQL: OFF
    com.zaxxer.hikari: INFO

---
# 부하 테스트 프로파일
spring:
  config:
    activate:
      on-profile: load-test
  jpa:
    properties:
      hibernate:
        generate_statistics: true   # 부하 테스트 시 쿼리 통계 활성화
logging:
  level:
    com.zaxxer.hikari: DEBUG        # 커넥션 풀 상태 추적
    org.hibernate.stat: DEBUG       # Hibernate 통계
