name: Collect DART Disclosure

# Render 무료 플랜에는 크론 잡이 없고, 무료 웹 서비스는 15분 유휴 시 잠들어 인스턴스 안의
# @Scheduled만으로는 주기 실행이 성립하지 않는다. collect-commodity.yml과 같은 구조다.
#
# 19:00 KST인 이유: 그 시각이면 당일 공시가 사실상 다 반영된다. 이후 접수분과 반영 지연 건은
# 다음날 배치의 D-1 범위가 자동으로 회수한다. 별도 스윕을 만들지 말 것 — 이미 내장돼 있다.
# 다른 예약 워크플로(18:10·18:20·18:30)와 10분씩 벌리는 관례를 따르지 않은 이유는, 19:00이
# 이미 그 군집과 30분 이상 떨어져 있어 같은 콜드 인스턴스를 나눠 먹을 일이 없어서다.
#
# **요일 필드(1-6)가 성립하는 조건은 "UTC 15:00 이전"이다.** cron은 UTC로 해석되므로 여기 적힌
# 요일은 UTC 요일이고, 우리가 원하는 건 KST 요일이다. UTC 10:00 + 9시간 = 같은 날 KST 19:00이라
# 두 요일이 같다. **시각을 UTC 15:00 이후로 옮기면 KST가 다음 날로 넘어가 토요일 실행이
# 일요일이 되면서 1-6에서 조용히 사라진다** — 실행이 안 되는 게 아니라 "요일이 하나 없어지는"
# 방식으로 틀리기 때문에 눈에 안 띈다. 시각을 옮기려는 사람은 이 문단을 먼저 읽을 것.
# (collect-commodity.yml에 같은 설명이 있다.)
#
# 공휴일에는 OpenDART가 status 013("조회된 데이타가 없습니다")을 준다. 백엔드가 이걸 정상
# 공백으로 처리하므로(disclosure.emptyResult=true) 잡은 초록으로 끝난다. 빨간 잡이 뜨면
# 그건 진짜 실패다.
on:
  schedule:
    - cron: "0 10 * * 1-6"   # UTC 10:00 = KST 19:00 (월~토)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # **겹치면 델타가 갈린다 — OpenDART 호출을 아끼자는 얘기가 아니다.** 두 실행이 같은 rcept_no를
  # 동시에 "없다"고 읽으면 ON CONFLICT가 한쪽만 살리는데, 진 쪽은 델타가 비어 elestock 호출을
  # 건너뛴다. 공시는 남고 소유변동만 빠지는 조용한 결손이 된다.
  #
  # cancel-in-progress: false여야 한다. true면 앞 실행을 죽여 절반만 저장된 구간이 남는데,
  # 겹침을 없애려다 정확히 반대편 손상을 만드는 셈이다. false는 겹치는 대신 줄을 세운다.
  group: collect-dart
  cancel-in-progress: false

jobs:
  collect:
    name: 공시 수집
    runs-on: ubuntu-latest
    # 아래 curl 재시도 예산(최악 10.5분)보다 커야 한다. 잡이 먼저 잘리면 요약도 애너테이션도
    # 남지 않고 "cancelled"만 떠서 백엔드 문제가 러너 문제처럼 보인다.
    timeout-minutes: 14
    steps:
      - name: Trigger collection
        env:
          # ${{ }}를 셸 본문에 직접 박지 않는다 — 표현식은 셸이 파싱하기 **전에** 문자열로
          # 치환되므로 값에 따옴표나 `$(...)`가 섞이면 그대로 명령이 된다. env로 넘기면
          # 셸이 값을 데이터로만 본다.
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL}" ] || [ -z "${SCHEDULER_TOKEN}" ]; then
            echo "::error::BACKEND_URL 또는 SCHEDULER_TOKEN 시크릿이 없습니다."
            exit 1
          fi

          # 끝의 슬래시를 지운다. 남겨두면 경로가 "//api/internal/..."이 되어 404가 난다.
          while [ "${BACKEND_URL}" != "${BACKEND_URL%/}" ]; do
            BACKEND_URL="${BACKEND_URL%/}"
          done

          # https만 허용한다. http로 두면 Render가 301로 넘기는데 -L이 없어 POST가 아예
          # 전달되지 않고 HTTP 301만 남는다(-L을 붙여도 --post301 없이는 POST가 GET으로
          # 바뀌어 소용없다). 아래 에러 범례에도 없는 코드라 원인 파악이 오래 걸린다.
          case "${BACKEND_URL}" in
            https://*) ;;
            *)
              # 값 자체는 찍지 않는다(시크릿). 형식만 알린다.
              echo "::error::BACKEND_URL 시크릿은 https://로 시작하고 끝에 슬래시가 없어야 합니다. 예: https://<서비스>.onrender.com"
              exit 1
              ;;
          esac

          # 날짜를 싣지 않는다. 백엔드가 null을 KST 오늘로 해석한다 — 여기서 계산하면
          # 러너의 UTC 시계가 그대로 데이터에 새겨져 19:00 KST 실행이 "어제"를 조회한다.
          #
          # 무료 인스턴스가 잠들어 있으면 첫 요청이 오래 걸리거나 502가 난다. **"30~90초"라고
          # 적혀 있던 그 수치는 틀렸다** — 2026-08-16 16:46 Daily Closing 실행(run 31959609091)
          # 실측은 첫 요청부터 첫 바이트까지 약 280초였다(웜일 때 같은 작업은 28초).
          # 재시도가 안전한 이유는 수집이 멱등하기 때문이다 — 같은 구간을 몇 번 돌려도
          # ON CONFLICT가 같은 행을 덮어쓴다.
          #
          # **멱등하다는 것이 "공짜"라는 뜻은 아니다.** curl이 --max-time에 포기해도 서버는
          # 그 수집을 끝까지 돌린다. 즉 재시도는 OpenDART 호출을 그만큼 더 쓰는 것이고, 뒤 시도가
          # 상류 제한에 걸리면 **이미 저장이 끝났는데도 잡이 빨개진다.** Collect FX가
          # 2026-08-12·13에 정확히 그렇게 죽었다(409·422). 같은 구조라 여기서도 언제든 난다.
          # 그래서 시도당 시간을 늘리고 재시도를 줄인다.
          #
          # -o/-w로 본문과 상태를 분리해 받는다. --fail을 쓰면 4xx/5xx에서 본문이 버려져
          # 왜 실패했는지 알 수 없게 된다.
          #
          # --max-time은 전체가 아니라 "시도 1회당" 상한이다. 그래서 최악 소요는
          # 300초 x 2회 시도 + 30초 x 1회 대기 = 630초(10.5분)이고, 이 값은 위
          # timeout-minutes(14)보다 작아야 한다 — 두 숫자는 따로 노는 값이 아니다.
          #
          # set -e 아래에서 명령 치환 대입은 그 종료 코드를 그대로 물려받는다. curl은 HTTP
          # 응답만 오면 4xx/5xx라도 0으로 끝나지만 전송 계층 실패(7 연결거부 / 28 타임아웃 /
          # 6 DNS / 35 TLS)에서는 0이 아니다. 그대로 두면 이 워크플로가 견디려고 만들어진
          # 바로 그 상황 — 콜드 인스턴스가 매 시도 --max-time을 넘기는 경우 — 에서 여기서
          # 죽어 요약도 에러 범례도 남지 않는다. 그래서 실패를 삼키고 센티널을 세운다.
          # curl 자신도 전송 실패 시 %{http_code}로 000을 찍으므로 000 = "HTTP 응답 없음".
          HTTP_CODE=$(curl -sS -X POST \
            "${BACKEND_URL}/api/internal/scheduler/dart/collect" \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            --max-time 300 \
            --retry 1 \
            --retry-delay 30 \
            --retry-all-errors \
            -o response.json \
            -w '%{http_code}') || HTTP_CODE="000"

          echo "HTTP ${HTTP_CODE}"

          # 이 저장소는 공개다. 토큰은 어디에도 찍지 않는다 — 요약은 영구 보존되고
          # 로그와 달리 GitHub의 시크릿 마스킹에 기대는 것도 위험하다.
          {
            echo "### DART 공시 수집"
            echo ""
            echo "HTTP \`${HTTP_CODE}\`"
            echo ""
            echo '```json'
            cat response.json 2>/dev/null || echo '(본문 없음)'
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 상태 코드가 정하는 건 "운영자를 어디로 보낼지"다.
          if [ "${HTTP_CODE}" != "200" ]; then
            # **본문을 stdout에도 찍는다 — 지우지 말 것.** 아래 범례는 원인 후보를 나열할 뿐이고,
            # 실제로 어느 쪽인지는 서버가 만든 예외 사유에만 들어 있다. 그 사유를 요약에만
            # 남기면 아무도 못 읽는다: $GITHUB_STEP_SUMMARY는 사람이 UI를 열어야 보이고 REST API로는
            # 안 나온다. 첫 실행에서 기대되는 실패가 하필 (1) 테이블 부재라 여기가 정확히 그 순간에
            # 필요하다.
            #
            # 시크릿은 안 샌다: 이 본문에는 토큰도 URL도 없고 OpenDART 인증키는 서버가 이미
            # 마스킹한다. 게다가 로그는 등록된 시크릿을 GitHub이 한 번 더 가려 주므로 요약보다
            # 오히려 안전하다. head -c로 자르는 이유는 HTML 오류 페이지가 돌아왔을 때 로그를
            # 통째로 덮지 않게 하려는 것.
            echo "응답 본문:"
            head -c 2000 response.json 2>/dev/null || echo '(본문 없음)'
            echo ""
            echo "::error::공시 수집 실패 (HTTP ${HTTP_CODE}). 500=대개 dart_* 테이블 부재(docs/superpowers/migrations/2026-08-18-dart-disclosure.sql을 운영 Neon에 적용했는지 확인 — ddl-auto: none이라 아무도 대신 만들어 주지 않는다. 위 응답 본문이 말해 준다) / 502=OpenDART 응답 이상(status 013은 정상 공백이라 여기 안 온다) / 503=SCHEDULER_TOKEN 미설정 / 401=토큰 불일치(양끝 공백·개행 확인) / 404=BACKEND_URL 경로 확인 / 000=백엔드 응답 없음(콜드 스타트·네트워크)"
            exit 1
          fi

          # 200이어도 응답 구조(DartRunResult)가 disclosure/insider 중첩이라 실패가 필드
          # 안쪽에 숨을 수 있다. 본문을 grep으로 재해석하지 않는다: 직렬화 형식이 조금만
          # 바뀌어도(들여쓰기·필드 순서) 조용히 아무것도 안 잡는 가드가 되어, 없느니만 못하다.
          # 그래서 진짜 JSON 파서로 읽는다. 본문이 없거나 깨졌으면 그것도 말한다 — 조용히
          # 넘어가면 위와 같은 실패가 된다.
          python3 - response.json <<'PY'
          import json, sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  body = json.load(f)
          except (OSError, ValueError) as e:
              print(f"::warning::HTTP 200인데 응답 본문을 읽지 못했습니다({e}). 수집 결과를 확인할 수 없습니다.")
              raise SystemExit(0)

          # 유효한 JSON이어도 객체가 아닐 수 있다 — `null`·`[]`·`"ok"`·`123`은 json.load를
          # 통과하고 아래 .get()에서 AttributeError로 터진다. 위 except는 ValueError만 잡으니
          # 파이썬이 역추적을 뱉고 종료 코드 1이 되어, **성공한 수집이 빨간 잡으로 끝난다.**
          # 여기서 죽어 봐야 얻는 정보가 없으므로 조용히 경고만 남긴다.
          if not isinstance(body, dict):
              print(f"::warning::HTTP 200인데 응답 본문이 JSON 객체가 아닙니다({type(body).__name__}). 수집 결과를 확인할 수 없습니다.")
              raise SystemExit(0)

          # DartRunResult = { disclosure: DartCollectSummary, insider: InsiderCollectSummary }.
          # 필드명이 바뀌면 이 스크립트가 조용히 None만 찍는 게 아니라 여기서 바로 경고로
          # 드러나야 한다 — 그래서 dict 여부까지 확인한다.
          disclosure = body.get("disclosure")
          insider = body.get("insider")
          if not isinstance(disclosure, dict) or not isinstance(insider, dict):
              print("::warning::HTTP 200인데 응답 본문에 disclosure/insider가 없습니다. DartRunResult 구조가 바뀌었는지 확인하세요.")
              raise SystemExit(0)

          bgn_de = disclosure.get("bgnDe")
          end_de = disclosure.get("endDe")
          pages = disclosure.get("pagesFetched")
          new_count = disclosure.get("newCount")
          empty_result = disclosure.get("emptyResult")
          calls = insider.get("calls")
          inserted = insider.get("inserted")
          failures = insider.get("failures") or []

          # **건수를 stdout에도 남긴다.** 잡 요약($GITHUB_STEP_SUMMARY)은 사람이 UI를 열어야만
          # 보이고 REST API로는 못 읽는다 — 로그에도 체크런 output에도 안 실린다(둘 다 null).
          # 매일 열어 보지 않아도 눈에 띄도록 ::notice::로 잡 로그 위쪽에 남긴다.
          print(
              f"::notice::공시 {bgn_de}~{end_de} pages={pages} new={new_count} empty={empty_result} "
              f"/ 소유변동 calls={calls} inserted={inserted} failures={len(failures)}"
          )

          if empty_result:
              # **실패가 아니다.** 공휴일에는 OpenDART가 status 013("조회된 데이타가
              # 없습니다")을 주고, 백엔드가 이걸 정상 공백으로 처리해 emptyResult=true를
              # 돌려준다. 평일에 계속 뜨면 그건 진짜 문제다 — 자동으로 못 가르는 구분이라
              # 사람에게 넘긴다.
              print("::warning::이번 구간은 신규 공시가 0건입니다 — 공휴일이면 정상(OpenDART status 013), 평일에 반복되면 확인할 것.")

          if failures:
              # **개행을 지운다.** 서비스는 실패 사유를 그대로 담을 수 있어 여러 줄일 수 있다.
              # ::warning::은 첫 줄만 먹으므로 나머지가 조용히 사라지고, 하필 이어지는 줄이
              # `::`로 시작하면 GitHub이 그걸 또 다른 워크플로 명령으로 해석한다.
              reasons = " | ".join(str(x).replace("\n", " ") for x in failures)
              print(f"::warning::임원·주요주주 소유변동 적재 실패 {len(failures)}건 (calls={calls} inserted={inserted}): {reasons}")
          PY
