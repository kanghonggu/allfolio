name: Collect Watch Valuation

# W5 · watchpricedata 평가를 하루 한 번 우리 DB로 복제한다.
#
# **평가(19:30, valuate-real-asset.yml)보다 먼저 돌아야 한다.** 이 잡이 채우는
# watch_valuation_cache를 WatchPriceSource가 읽는다 — 순서가 뒤집히면 시계 평가가 하루 묵은
# 캐시를 쓴다. 19:20으로 잡은 이유가 그것이고, 옮길 때는 19:30보다 앞인지 반드시 확인할 것.
#
# 앞 슬롯: 18:10(금리·환율) · 18:20(원자재) · 18:30(벤치마크) · 19:00(공시).
# 19:00 공시의 최악이 19:10:30이라 19:20은 그 뒤다.
#
# **요일 필터가 없다 — 매일 돈다.** 시계 매물은 주말에도 올라온다. 형제 시세 수집들이
# 평일만 도는 것은 거래소가 주말에 안 열기 때문이고, 여기엔 그 이유가 없다.
#
# **502가 없다 — 형제 수집들과 갈리는 지점이다.** 상류(watchpricedata)를 부르지만 하루 못
# 받아도 폴백이 직전 값을 쓴다. 장애가 아니라 신선도가 하루 낡은 것이고 staleness가 말한다.
#
# 타임아웃 예산은 형제들과 같게 잡는다 — Render 콜드 스타트 실측이 280초다.

on:
  schedule:
    - cron: "20 10 * * *" # 19:20 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Trigger watch valuation collect
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail

          # 재시도를 늘리지 말 것. 이 배치는 서버에서 ref마다 외부 호출을 돌리므로,
          # 앞 시도가 살아 있는 채로 두 번째가 들어가면 같은 일을 겹쳐 돌린다 —
          # AF-110에서 "저장은 됐는데 잡은 빨간" 실패를 그렇게 만들었다.
          response=$(curl -sS -X POST \
            --max-time 300 --retry 1 --retry-delay 30 --retry-connrefused \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            -w "\n%{http_code}" \
            "${BACKEND_URL}/api/internal/scheduler/watch/collect")

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "$body"
          echo "HTTP $code"

          # 200만 성공이다. 대상 0건도 200으로 온다 — 아직 아무도 시계를 등록하지 않은
          # 상태가 정상이기 때문이다(W6 전까지는 등록 경로 자체가 없다).
          if [ "$code" != "200" ]; then
            echo "::error::시계 평가 복제 실패 (HTTP $code)"
            echo "500이면 우리 문제다 — 마이그레이션(2026-09-02-watch-valuation-cache.sql) 적용 여부부터 볼 것"
            exit 1
          fi
