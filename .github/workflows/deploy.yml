name: Backend Verification

on:
  push:
    branches:
      - main
    paths:
      - "allfolio-backend/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "allfolio-backend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build backend JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build JAR
        run: |
          cd allfolio-backend
          ./gradlew :backend-app:bootJar -x test --no-daemon
