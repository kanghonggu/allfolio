name: Backend Verification

# 경로 필터를 두지 않는다.
# 필수 체크(required status check)로 지정하면, 경로가 안 맞아 워크플로가 아예 실행되지
# 않은 PR은 체크가 "실행 대기"로 남아 머지가 무기한 막힌다. 프론트만 고친 PR이
# 영원히 못 들어가는 상황이 되므로, 항상 돌게 두고 캐시로 시간을 줄인다.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build backend JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build JAR
        run: |
          cd allfolio-backend
          ./gradlew :backend-app:bootJar -x test --no-daemon

  # 빌드와 분리한 이유: 실패 원인이 "컴파일이 깨졌다"인지 "테스트가 깨졌다"인지
  # 체크 이름만 보고 구분되고, 두 잡이 병렬로 돌아 전체 대기시간도 늘지 않는다.
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      # 전 모듈 대상 — bootJar의 -x test 때문에 그동안 테스트가 아예 검증되지 않았고,
      # 테스트 코드가 컴파일조차 안 되는 상태로 머지된 적이 있다(2026-08-10, PR #126).
      - name: Run tests
        run: |
          cd allfolio-backend
          ./gradlew test --no-daemon

      # 실패했을 때 어느 케이스가 깨졌는지 로그만 보고 찾기 어렵다
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: allfolio-backend/*/build/reports/tests/test
          retention-days: 7
