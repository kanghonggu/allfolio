name: Backend Verification

on:
  push:
    branches:
      - main
    paths:
      - "allfolio-backend/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "allfolio-backend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build backend JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build JAR
        run: |
          cd allfolio-backend
          ./gradlew :backend-app:bootJar -x test --no-daemon

  # 빌드와 분리한 이유: 실패 원인이 "컴파일이 깨졌다"인지 "테스트가 깨졌다"인지
  # 체크 이름만 보고 구분되고, 두 잡이 병렬로 돌아 전체 대기시간도 늘지 않는다.
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      # 전 모듈 대상 — bootJar의 -x test 때문에 그동안 테스트가 아예 검증되지 않았고,
      # 테스트 코드가 컴파일조차 안 되는 상태로 머지된 적이 있다(2026-08-10, PR #126).
      - name: Run tests
        run: |
          cd allfolio-backend
          ./gradlew test --no-daemon

      # 실패했을 때 어느 케이스가 깨졌는지 로그만 보고 찾기 어렵다
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: allfolio-backend/*/build/reports/tests/test
          retention-days: 7
