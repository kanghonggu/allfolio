name: FX Backfill

# AF-100 ECOS 과거 환율 백필을 어드민 토큰 없이 돌리는 길.
#
# 이 워크플로가 있는 이유는 어드민 JWT가 15분 만료라서다 — 사람이 로그인해서 토큰을 복사하고
# 셸에 export 하는 동안 만료되기도 하고, 무엇보다 그 토큰은 전권이라 손으로 옮길수록 샌다.
# 백엔드의 /api/internal/scheduler/fx/backfill은 수집 트리거와 같은 SCHEDULER_TOKEN을 쓰는데,
# 백필이 하는 일이 ECOS 값으로 fx_rate_daily를 멱등하게 쓰는 것뿐이라 폭발 반경이 같다.
#
# **cron을 붙이지 않는다.** 백필은 "과거 구간을 한 번 채우는" 운영 작업이지 주기 작업이 아니다.
# 매일 도는 환율 수집은 collect-fx.yml이 이미 하고 있고, 여기에 스케줄을 달면 같은 구간을
# 매일 다시 긁어 ECOS 호출만 태운다.
on:
  workflow_dispatch:
    inputs:
      currency:
        description: "백필할 통화"
        type: choice
        # choice의 첫 항목이 사실상의 기본값이다(GitHub이 항상 미리 선택한다).
        # USD가 먼저인 이유는 백필의 압도적 다수가 USD이고, 잘못 눌러도 그 구간은
        # 어차피 채워야 할 구간이기 때문이다.
        options: [USD, BTC, ETH]
        required: true
      from:
        description: "시작일 (YYYY-MM-DD)"
        # **default를 두지 않는다.** 기본 구간이 있으면 "Run workflow"를 눌러 그대로 둔 실행이
        # 운영자가 요청했다고 믿는 구간과 다른 구간을 채운다. 손상은 없지만(멱등하다) 그 뒤
        # "왜 2019년이 비어 있지"를 다시 조사하게 된다. 비워 두면 GitHub이 실행을 막는다.
        required: true
      to:
        description: "종료일 (YYYY-MM-DD)"
        required: true

permissions:
  contents: read

concurrency:
  # 두 백필이 겹치면 같은 (통화, 기준일) 행을 두 요청이 동시에 밀어 넣어 uk_fx_rate_daily
  # 위반으로 409가 난다(FxRateAdminController.backfill이 그래서 409를 따로 매핑한다).
  # 앞선 실행을 죽이지 않고 기다리는 이유는 백필이 중간에 잘려도 성공한 구간은 남고,
  # 잘린 구간을 사람이 다시 지정해야 하기 때문이다 — 취소가 곧 "어디까지 됐는지 모름"이다.
  group: fx-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: ECOS 과거 환율 백필
    runs-on: ubuntu-latest
    # 스크립트는 연 단위로 쪼개 구간마다 ECOS 왕복 + sleep 2초를 돈다. 2000년대까지 거슬러
    # 올라가는 요청이면 구간이 스물몇 개가 되고, 콜드 스타트가 겹치면 구간당 1분을 넘길 수도 있다.
    # 아래 워밍업 예산(최악 6분)까지 더해도 넉넉하도록 크게 잡는다 — 잡이 먼저 잘리면
    # 어디까지 채웠는지가 요약에 남지 않아 다시 돌릴 구간을 사람이 추측해야 한다.
    timeout-minutes: 45
    steps:
      - name: Checkout
        # 청킹·실패 정책·BSD/GNU date 호환·합계 집계는 전부 scripts/fx-backfill.sh에 있다.
        # 그 로직을 YAML로 옮기면 두 벌이 갈라지고, 사람이 손으로 돌리는 경로(어드민 토큰)와
        # CI 경로가 서로 다른 코드를 타게 된다. 그래서 체크아웃해서 같은 스크립트를 부른다.
        uses: actions/checkout@v4

      - name: Run backfill
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
          # ${{ }}를 셸 본문에 직접 박지 않는다 — 표현식은 셸이 파싱하기 **전에** 문자열로
          # 치환되므로 값에 따옴표나 `$(...)`가 섞이면 그대로 명령이 된다. currency는 choice라
          # 안전하지만 from/to는 자유 입력이라 특히 그렇다. env로 넘기면 셸이 값을 데이터로만 본다.
          INPUT_CURRENCY: ${{ github.event.inputs.currency }}
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_TO: ${{ github.event.inputs.to }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL}" ] || [ -z "${SCHEDULER_TOKEN}" ]; then
            echo "::error::BACKEND_URL 또는 SCHEDULER_TOKEN 시크릿이 없습니다."
            exit 1
          fi

          # 끝의 슬래시를 지운다. 남겨두면 경로가 "//api/internal/..."이 되어 404가 난다.
          while [ "${BACKEND_URL}" != "${BACKEND_URL%/}" ]; do
            BACKEND_URL="${BACKEND_URL%/}"
          done

          # https만 허용한다. http로 두면 Render가 301로 넘기는데 스크립트의 curl에 -L이 없어
          # POST가 아예 전달되지 않고 HTTP 301만 남는다(-L을 붙여도 --post301 없이는 POST가
          # GET으로 바뀌어 소용없다). 스크립트의 실패 코드 범례에도 없는 코드라 원인 파악이 오래 걸린다.
          case "${BACKEND_URL}" in
            https://*) ;;
            *)
              # 값 자체는 찍지 않는다(시크릿). 형식만 알린다.
              echo "::error::BACKEND_URL 시크릿은 https://로 시작하고 끝에 슬래시가 없어야 합니다. 예: https://<서비스>.onrender.com"
              exit 1
              ;;
          esac

          # from/to는 자유 입력이고 그대로 쿼리스트링에 실린다. 형식을 여기서 못 박는다 —
          # 통과시키면 스크립트의 date 산술이 조용히 이상하게 굴거나(BSD date는 형식이 틀리면
          # GNU 분기로 폴백해 또 실패한다) 백엔드가 구간마다 400을 돌려줘, 진짜 원인인
          # "2026/08/12라고 적었다"가 스무 줄 아래에 묻힌다.
          # 여기서 막는 건 형식뿐이다. 존재하지 않는 날짜(2026-02-31)나 from > to는
          # 스크립트와 백엔드가 각자 판단한다 — 그 판단을 여기 복제하면 두 벌이 갈라진다.
          DATE_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if ! [[ "${INPUT_FROM}" =~ $DATE_RE ]]; then
            echo "::error::from 입력이 YYYY-MM-DD 형식이 아닙니다: '${INPUT_FROM}'. 예: 2020-01-01"
            exit 1
          fi
          if ! [[ "${INPUT_TO}" =~ $DATE_RE ]]; then
            echo "::error::to 입력이 YYYY-MM-DD 형식이 아닙니다: '${INPUT_TO}'. 예: 2026-08-12"
            exit 1
          fi

          echo "currency=${INPUT_CURRENCY} ${INPUT_FROM} ~ ${INPUT_TO}"

          # **먼저 인스턴스를 깨운다.** Render 무료 서비스는 15분 유휴 시 잠들고, 잠든 상태의
          # 첫 요청은 30~90초가 걸리거나 502로 끊긴다. scripts/fx-backfill.sh의 curl에는
          # 재시도가 없어서(사람이 보면서 돌리는 전제로 만들어졌다) 콜드 스타트를 그대로 맞으면
          # 첫 구간이 실패한다 — 502는 스크립트의 중단 조건(400/500)이 아니라 그대로 다음
          # 구간으로 넘어가므로, 첫 해가 조용히 빈 채로 잡이 초록으로 끝날 수 있다.
          # 그래서 백필을 시작하기 전에 여기서 깨워 둔다.
          #
          # /actuator/health는 GET이고 부작용이 없어 재시도가 안전하다.
          # 최악 소요는 60초 x 6회 시도 + 15초 x 5회 대기 = 435초(약 7분)이고,
          # 위 timeout-minutes(45)가 이걸 포함해도 충분하다.
          echo "인스턴스 워밍업..."
          curl -sS -o /dev/null \
            --max-time 60 \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            "${BACKEND_URL}/actuator/health" \
            || echo "::warning::워밍업 요청이 실패했습니다. 백필을 계속 진행하지만 첫 구간이 콜드 스타트를 맞을 수 있습니다."

          # 스크립트 출력을 로그와 요약에 동시에 남긴다. 요약이 있어야 "어느 구간이 실패했는지"를
          # 로그를 열지 않고도 본다. 스크립트가 0이 아닌 코드로 끝나면 잡도 실패해야 하는데
          # 파이프 왼쪽의 종료 코드는 그냥 두면 tee에 먹히므로 PIPESTATUS로 되살린다.
          #
          # **이 저장소는 공개다.** 토큰은 env로만 넘어가고 스크립트는 토큰을 출력하지 않는다.
          # URL도 찍지 않는다(BACKEND_URL이 시크릿이다) — 스크립트가 찍는 건 구간과 집계뿐이다.
          set +e
          ALLFOLIO_API="${BACKEND_URL}" \
          ALLFOLIO_SCHEDULER_TOKEN="${SCHEDULER_TOKEN}" \
            ./scripts/fx-backfill.sh "${INPUT_FROM}" "${INPUT_TO}" "${INPUT_CURRENCY}" 2>&1 | tee backfill.log
          STATUS="${PIPESTATUS[0]}"
          set -e

          {
            echo "### ECOS 과거 환율 백필 (${INPUT_CURRENCY})"
            echo ""
            echo "구간 \`${INPUT_FROM}\` ~ \`${INPUT_TO}\` · 종료 코드 \`${STATUS}\`"
            echo ""
            echo '```'
            cat backfill.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${STATUS}" != "0" ]; then
            echo "::error::백필 스크립트가 실패했습니다 (종료 코드 ${STATUS}). 위 요약의 구간별 HTTP 코드를 확인하세요. 401=SCHEDULER_TOKEN 불일치 / 503=백엔드에 스케줄러 토큰 미설정 / 502=ECOS 응답 이상 / 409=동시 실행 / 000=백엔드 응답 없음"
            exit 1
          fi

          # **종료 코드 0이 "다 채웠다"는 뜻이 아니다.** 스크립트는 구간이 실패해도 0으로 끝난다
          # (성공한 구간은 이미 저장됐고 재실행이 안전하다는 설계라, 사람이 보면서 돌릴 때는 그게 옳다).
          # 그대로 두면 토큰이 틀려 전 구간이 401로 죽어도 잡이 초록으로 끝난다 — collect-index에서
          # 3건 중 2건이 403으로 죽었는데 두 실행 모두 초록이라 아무도 모르던 것과 같은 실패다.
          # 합계 줄은 스크립트가 마지막에 "실패 구간 N"으로 찍는다.
          #
          # collect-index와 달리 여기서는 애너테이션에 그치지 않고 **잡을 실패시킨다.** 그쪽은 매일
          # 도는 크론이라 지수 하나가 흔들릴 때마다 빨개지면 아무도 안 보게 되지만, 이건 사람이
          # 눌러서 한 번 돌리고 결과를 기다리는 작업이다. 안 채워진 구간이 남았다는 건 곧
          # "그 구간을 다시 돌려야 한다"이고, 그 신호는 초록 옆의 노란 글씨보다 빨간 잡이어야 한다.
          FAILED_CHUNKS="$(sed -n 's/.*실패 구간 \([0-9][0-9]*\).*/\1/p' backfill.log | tail -n 1)"
          if [ -z "${FAILED_CHUNKS}" ]; then
            # 합계 줄이 없다 = 스크립트가 끝까지 가지 못했다(중간에 죽었거나 출력 형식이 바뀌었다).
            # 조용히 넘어가면 위 가드가 아무것도 안 잡는 장식이 된다.
            echo "::error::백필 로그에서 합계 줄('실패 구간 N')을 찾지 못했습니다. 어디까지 채워졌는지 확인할 수 없으니 요약을 직접 읽어주세요."
            exit 1
          fi
          if [ "${FAILED_CHUNKS}" != "0" ]; then
            echo "::error::${FAILED_CHUNKS}개 구간이 실패했습니다. 요약에서 해당 구간의 HTTP 코드를 확인하고 그 구간만 다시 실행하세요(백필은 멱등합니다). 401=SCHEDULER_TOKEN 불일치 / 503=백엔드에 스케줄러 토큰 미설정 / 502=ECOS 응답 이상 / 409=동시 실행 / 000=백엔드 응답 없음"
            exit 1
          fi
