name: Daily Closing

# Render 무료 플랜에는 크론 잡이 없고, 무료 웹 서비스는 15분 유휴 시 잠들어 인스턴스 안의
# @Scheduled만으로는 주기 실행이 성립하지 않는다. 운영 로그 확인 결과 6일 중 4일은 자정·01:30
# 두 트리거가 아예 안 떴다. collect-*.yml과 같은 구조다.
#
# **요일 필터(1-5)를 걸지 말 것.** wf_step 시드에서 S010~S050이 holiday_except_yn = FALSE이고
# WfScheduleJudge가 `D -> !holidayExcept || isBizDay`로 판정하므로 주말·공휴일 포함 매일
# 실행이 정의된 동작이다. 공휴일을 쉬어야 하는 단계가 생기면 그건 wf_step 데이터로 정한다.
#
# **요일 필터를 나중에 추가하려는 사람은 이 문단을 먼저 읽을 것.** cron은 UTC로 해석되고
# UTC 15:00은 KST 날짜 경계다 — 요일을 적으면 그건 UTC 요일이 되고, KST로는 다음 날이라
# 금요일 실행이 KST 토요일이 되어 1-5에서 조용히 사라진다. collect-rate.yml이 같은 함정을
# 반대편(UTC 09:10, 경계 한참 전)에서 설명해 뒀지만 그 문장은 15:00을 담지 못한다.
#
# 두 시각은 구 ClosingScheduler의 자정 + 01:30을 그대로 옮긴 것이다. 01:30은 게이트에서
# SKIP된 단계의 재시도용이고, 이미 SUCCESS인 하위단계는 WfStepExecutor가 멱등 스킵한다.
on:
  schedule:
    - cron: "0 15 * * *"    # UTC 15:00 = KST 익일 00:00
    - cron: "30 16 * * *"   # UTC 16:30 = KST 익일 01:30 — 게이트 SKIP 재시도
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 두 크론이 밀려 겹치면 뒤엣것이 wf:lock:{ymd}에 막혀 409로 끝난다. 사고는 아니지만
  # 매번 빨간 잡이 되어 진짜 실패와 구분이 안 된다 — 겹치는 대신 줄을 세운다.
  #
  # cancel-in-progress: false여야 한다. true면 앞 실행을 마감 도중에 죽이는데, 러너를 죽여도
  # 서버의 runDaily는 계속 돌아 락이 남고 결과는 아무 데도 안 남는다. 겹침을 없애려다
  # "무슨 일이 있었는지 모르는 마감"을 만드는 셈이다.
  group: closing
  cancel-in-progress: false

jobs:
  closing:
    name: 일별 마감
    runs-on: ubuntu-latest
    # 아래 curl 재시도 예산(최악 9분)보다 커야 한다. 잡이 먼저 잘리면 요약도 애너테이션도
    # 남지 않고 "cancelled"만 떠서 백엔드 문제가 러너 문제처럼 보인다.
    timeout-minutes: 12
    steps:
      - name: Trigger closing
        env:
          # ${{ }}를 셸 본문에 직접 박지 않는다 — 표현식은 셸이 파싱하기 **전에** 문자열로
          # 치환되므로 값에 따옴표나 `$(...)`가 섞이면 그대로 명령이 된다. env로 넘기면
          # 셸이 값을 데이터로만 본다.
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL}" ] || [ -z "${SCHEDULER_TOKEN}" ]; then
            echo "::error::BACKEND_URL 또는 SCHEDULER_TOKEN 시크릿이 없습니다."
            exit 1
          fi

          # 끝의 슬래시를 지운다. 남겨두면 경로가 "//api/internal/..."이 되어 404가 난다.
          while [ "${BACKEND_URL}" != "${BACKEND_URL%/}" ]; do
            BACKEND_URL="${BACKEND_URL%/}"
          done

          # https만 허용한다. http로 두면 Render가 301로 넘기는데 -L이 없어 POST가 아예
          # 전달되지 않고 HTTP 301만 남는다(-L을 붙여도 --post301 없이는 POST가 GET으로
          # 바뀌어 소용없다). 아래 에러 범례에도 없는 코드라 원인 파악이 오래 걸린다.
          case "${BACKEND_URL}" in
            https://*) ;;
            *)
              # 값 자체는 찍지 않는다(시크릿). 형식만 알린다.
              echo "::error::BACKEND_URL 시크릿은 https://로 시작하고 끝에 슬래시가 없어야 합니다. 예: https://<서비스>.onrender.com"
              exit 1
              ;;
          esac

          # 날짜를 싣지 않는다. 백엔드가 KST 오늘로 정한다 — 여기서 계산하면 러너의 UTC
          # 시계가 그대로 마감 일자에 새겨지고, UTC 15:00은 하필 KST 날짜 경계라 하루가 밀린다.
          #
          # 무료 인스턴스가 잠들어 있으면 첫 요청이 30~90초 걸리거나 502가 난다.
          # 재시도가 안전한 이유는 마감이 멱등하기 때문이다 — WfStepExecutor가 wf:lock:{ymd}로
          # 중복 실행을 막고(경합은 409), 이미 SUCCESS인 하위단계는 재실행하지 않는다.
          #
          # -o/-w로 본문과 상태를 분리해 받는다. --fail을 쓰면 4xx/5xx에서 본문이 버려져
          # 왜 실패했는지(502 상류 장애인지 500 코드 오류인지) 알 수 없게 된다.
          #
          # --max-time은 전체가 아니라 "시도 1회당" 상한이다. 그래서 최악 소요는
          # 120초 x 4회 시도 + 20초 x 3회 대기 = 540초(9분)이고, 이 값은 위
          # timeout-minutes(12)보다 작아야 한다 — 두 숫자는 따로 노는 값이 아니다.
          #
          # set -e 아래에서 명령 치환 대입은 그 종료 코드를 그대로 물려받는다. curl은 HTTP
          # 응답만 오면 4xx/5xx라도 0으로 끝나지만 전송 계층 실패(7 연결거부 / 28 타임아웃 /
          # 6 DNS / 35 TLS)에서는 0이 아니다. 그대로 두면 이 워크플로가 견디려고 만들어진
          # 바로 그 상황 — 콜드 인스턴스가 매 시도 --max-time을 넘기는 경우 — 에서 여기서
          # 죽어 요약도 에러 범례도 남지 않는다. 그래서 실패를 삼키고 센티널을 세운다.
          # curl 자신도 전송 실패 시 %{http_code}로 000을 찍으므로 000 = "HTTP 응답 없음".
          HTTP_CODE=$(curl -sS -X POST \
            "${BACKEND_URL}/api/internal/scheduler/closing" \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 20 \
            --retry-all-errors \
            -o response.json \
            -w '%{http_code}') || HTTP_CODE="000"

          echo "HTTP ${HTTP_CODE}"

          # 이 저장소는 공개다. 토큰은 어디에도 찍지 않는다 — 요약은 영구 보존되고
          # 로그와 달리 GitHub의 시크릿 마스킹에 기대는 것도 위험하다.
          {
            echo "### 일별 마감"
            echo ""
            echo "HTTP \`${HTTP_CODE}\`"
            echo ""
            echo '```json'
            cat response.json 2>/dev/null || echo '(본문 없음)'
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 상태 코드가 정하는 건 "운영자를 어디로 보낼지"다.
          # 401 = 토큰 불일치(대시보드와 GitHub 시크릿 사이를 손으로 옮기다 개행이 붙는 게 흔하다)
          # 503 = 서버에 scheduler.trigger-token 미설정 — 엔드포인트가 스스로 닫혀 있다
          # 409 = 같은 일자 마감이 이미 실행 중(두 크론이 겹쳤거나 어드민이 수동 실행 중)
          # 500 = 대개 wf_ 테이블 부재. docs/superpowers/migrations/2026-07-31-closing-workflow.sql을
          #       운영 Neon에 적용했는지 확인할 것 — ddl-auto: none이라 아무도 대신 만들어 주지 않는다
          if [ "${HTTP_CODE}" != "200" ]; then
            # **본문을 stdout에도 찍는다 — 지우지 말 것.** 위 범례는 500을 "대개 테이블 부재"로만
            # 말할 뿐이고, 실제로 어느 테이블이 없는지(혹은 전혀 다른 원인인지)는 서버가 만든
            # 예외 사유에만 들어 있다. 그 사유를 요약에만 남기면 아무도 못 읽는다:
            # $GITHUB_STEP_SUMMARY는 사람이 UI를 열어야 보이고 REST API로는 안 나온다.
            # 첫 실행에서 기대되는 실패가 하필 그 500이라 여기가 정확히 그 순간에 필요하다.
            #
            # 시크릿은 안 샌다: 이 본문에는 토큰도 URL도 없다. 게다가 로그는 등록된 시크릿을
            # GitHub이 한 번 더 가려 주므로 요약보다 오히려 안전하다.
            # head -c로 자르는 이유는 HTML 오류 페이지가 돌아왔을 때 로그를 통째로 덮지 않게 하려는 것.
            echo "응답 본문:"
            head -c 2000 response.json 2>/dev/null || echo '(본문 없음)'
            echo ""
            echo "::error::일별 마감 실패 (HTTP ${HTTP_CODE}). 500=대개 wf_ 테이블 부재(docs/superpowers/migrations/2026-07-31-closing-workflow.sql을 운영 Neon에 적용했는지 확인 — ddl-auto: none이라 아무도 대신 만들어 주지 않는다. 위 응답 본문이 어느 쪽인지 말해 준다) / 503=SCHEDULER_TOKEN 미설정 / 401=토큰 불일치(양끝 공백·개행 확인) / 409=같은 일자 마감이 이미 실행 중 / 404=BACKEND_URL 경로 확인 / 000=백엔드 응답 없음(콜드 스타트·네트워크)"
            exit 1
          fi

          # 200이어도 "아무 단계도 안 돌았다"일 수 있다 — 게이트에서 전부 SKIP되거나 wf_step이
          # 비어 있어도 runDaily는 빈 요약을 200으로 돌려준다. 그게 바로 이 워크플로가 고치려는
          # 증상(performance_daily가 안 쌓인다)과 겉모습이 같으므로 초록으로 넘기지 않는다.
          #
          # 본문을 grep으로 재해석하지 않는다: 직렬화 형식이 조금만 바뀌어도(들여쓰기·필드 순서)
          # 조용히 아무것도 안 잡는 가드가 되어, 없느니만 못하다. 그래서 진짜 JSON 파서로 읽는다.
          python3 - response.json <<'PY'
          import json, sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  body = json.load(f)
          except (OSError, ValueError) as e:
              print(f"::warning::HTTP 200인데 응답 본문을 읽지 못했습니다({e}). 실행된 단계를 확인할 수 없습니다.")
              raise SystemExit(0)

          # 유효한 JSON이어도 객체가 아닐 수 있다 — `null`·`[]`·`"ok"`는 json.load를 통과하고
          # 아래 body.get()에서 AttributeError로 터져, **성공한 마감이 빨간 잡으로 끝난다.**
          if not isinstance(body, dict):
              print(f"::warning::HTTP 200인데 응답 본문이 JSON 객체가 아닙니다({type(body).__name__}). 실행된 단계를 확인할 수 없습니다.")
              raise SystemExit(0)

          executed = body.get("executedSteps") or []
          gate_skipped = body.get("gateSkippedSteps") or []
          not_scheduled = body.get("notScheduledSteps") or []

          # **단계 목록을 stdout에도 남긴다.** 잡 요약($GITHUB_STEP_SUMMARY)은 사람이 UI를
          # 열어야만 보이고 REST API로는 못 읽는다 — 로그에도 체크런 output에도 안 실린다.
          # 그래서 이 줄이 없으면 "실패는 아닌데 단계가 조용히 줄어든 경우"를 아무도 못 가른다.
          print(
              f"마감 결과: ymd={body.get('ymd')} executed={len(executed)} "
              f"gateSkipped={len(gate_skipped)} notScheduled={len(not_scheduled)} "
              f"| executed={executed} gateSkipped={gate_skipped} notScheduled={not_scheduled}"
          )

          if not executed:
              # 01:30 재시도가 있는 이유가 이것이지만, 두 번 다 비어 있으면 사람이 봐야 한다.
              print("::warning::실행된 단계가 없습니다 — wf_step 시드와 선행단계 게이트를 확인하세요.")

          if gate_skipped:
              # **실패가 아니다.** 선행단계가 아직 FINISH가 아니면 다음 트리거에서 재시도한다.
              # 다만 01:30 실행에서도 같은 단계가 계속 뜨면 그건 막힌 것이다.
              print(f"::warning::게이트에서 SKIP된 단계: {', '.join(str(x) for x in gate_skipped)} (다음 트리거에서 재시도)")
          PY
