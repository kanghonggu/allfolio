name: Collect Index (Overseas)

# 해외 지수 9종 수집 (AF-110). 구조는 collect-index.yml(국내)과 같고, 그 파일의 주석에
# 적힌 함정들(끝 슬래시·https 강제·--max-time이 시도당 상한·전송 실패 센티널·토큰 비노출)이
# 여기에도 그대로 살아 있다. 하나라도 빼면 같은 사고가 다시 난다.
#
# **국내 워크플로에 cron을 얹지 않고 파일을 나눈 이유.** GitHub은 워크플로 파일의 *어느*
# 스케줄이 울리든 그 파일의 *모든* 잡을 돌린다. 해외 cron을 collect-index.yml에 넣으면
# domestic-index 잡도 같이 깨어나 그쪽 case의 `*)` 분기(처음 보는 cron)에 걸려 매번
# 빨갛게 실패한다. 반대도 마찬가지다. **두 파일을 "정리"해 합치지 말 것.**
#
# 시각: UTC 21:30 = KST 익일 06:30 (미국·유럽) / UTC 08:30 = KST 당일 17:30 (아시아).
# 두 시각 모두 대상 시장의 마감 이후다 —
#   US   21:30 UTC → 뉴욕 17:30(서머타임)·16:30(겨울), 마감 16:00 이후.
#                    베를린 23:30·22:30, 유로스톡스 마감 17:30 이후(그래서 STOXX50이 US 슬롯이다).
#   ASIA 08:30 UTC → 도쿄 17:30(마감 15:30) / 홍콩 16:30(마감 16:00) / 상해 16:30(마감 15:00).
# 마감 직후가 아니라 넉넉히 뒤로 잡은 이유는 GitHub 예약 워크플로가 러너 혼잡 시 5~30분
# 밀리기 때문이다. 밀리는 방향은 항상 뒤쪽이라 앞당겨져 장중 값을 잡을 위험은 없다.
on:
  schedule:
    # **`1-5`는 UTC 요일이다. 한국 요일에 맞추려고 고치지 말 것.**
    # 금요일 21:30 UTC는 KST로 토요일 06:30에 떨어지지만, 잡는 것은 **금요일 미국 종가**다.
    # 실행 시각이 아니라 대상 시장의 영업일에 맞춘 범위이고, 그게 맞다.
    # 손으로 확인한 결과 — 어느 쪽으로 옮겨도 종가 하루를 잃는다:
    #   1-5 (현재): 월~금 미국 종가 전부. 헛도는 실행 없음.
    #   0-4 (KST 월~금 06:30으로 "고친 것"): **금요일 종가를 잃고** 일요일에 휴장을 조회한다.
    #   2-6 (KST 화~토로 "고친 것"):        **월요일 종가를 잃고** 토요일에 휴장을 조회한다.
    # 잃은 종가는 실패가 아니라 그냥 없는 행으로 남아 잡은 초록으로 끝난다 — 아무도 모른다.
    - cron: "30 21 * * 1-5"   # KST 익일 06:30 — 미국·유럽 (US)
    - cron: "30 8 * * 1-5"    # KST 당일 17:30 — 아시아   (ASIA)
  workflow_dispatch:
    inputs:
      schedule:
        description: "수집할 시장군"
        type: choice
        # **default를 두지 않는다.** 국내(slot)와 같은 이유지만 손해의 모양이 다르다:
        # 해외의 schedule은 "하루 중 지점"이 아니라 **어느 시장군**이라, 잘못 고르면 그 실행이
        # 다른 쪽 시장군을 건드리는 게 아니라 **의도한 쪽을 통째로 건너뛴다.** 빈 자리는
        # 실패가 아니라 "없는 데이터"로 보여 failures에도 안 남는다.
        #
        # **options 순서는 장식이 아니다.** GitHub은 choice의 첫 항목을 항상 미리 선택하므로
        # 첫 자리가 사실상의 기본값이다. US가 먼저인 이유: 사람이 "Run workflow"를 누르는
        # 시각은 대개 한국 낮(00~12 UTC)인데, 그때 미국장(13:30~20:00 UTC)은 닫혀 있어
        # 확정된 전일 종가를 받는다. 반대로 아시아장은 **바로 그 시간대에 열려 있어**
        # 진행 중인 봉이 그날의 CLOSE 행에 `장중`으로 박힌다. 알파벳순으로 "정리"하지 말 것.
        options: [US, ASIA]
        required: true

permissions:
  contents: read

concurrency:
  # 국내와 별도 그룹이다. 같은 그룹에 묶으면 08:30 ASIA가 밀렸을 때 국내 09:10 OPEN(00:10 UTC)과
  # 서로를 기다리게 되는데, 둘은 건드리는 행이 아예 달라 직렬화할 이유가 없다.
  group: collect-index-overseas
  cancel-in-progress: false

jobs:
  overseas-index:
    name: 해외 지수 수집
    runs-on: ubuntu-latest
    # 아래 curl 재시도 예산(최악 9분)보다 커야 한다. 잡이 먼저 잘리면 요약도 애너테이션도
    # 남지 않고 "cancelled"만 떠서 백엔드 문제가 러너 문제처럼 보인다.
    timeout-minutes: 12
    steps:
      - name: Trigger collection
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
          # ${{ }}를 셸 본문에 직접 박지 않는다 — 표현식은 셸이 파싱하기 **전에** 문자열로
          # 치환되므로 값에 따옴표나 `$(...)`가 섞이면 그대로 명령이 된다. env로 넘기면
          # 셸이 값을 데이터로만 본다.
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCHEDULE: ${{ github.event.inputs.schedule }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL}" ] || [ -z "${SCHEDULER_TOKEN}" ]; then
            echo "::error::BACKEND_URL 또는 SCHEDULER_TOKEN 시크릿이 없습니다."
            exit 1
          fi

          # 끝의 슬래시를 지운다. 남겨두면 경로가 "//api/internal/..."이 되어 404가 난다.
          while [ "${BACKEND_URL}" != "${BACKEND_URL%/}" ]; do
            BACKEND_URL="${BACKEND_URL%/}"
          done

          # https만 허용한다. http로 두면 Render가 301로 넘기는데 -L이 없어 POST가 아예
          # 전달되지 않고 HTTP 301만 남는다(-L을 붙여도 --post301 없이는 POST가 GET으로
          # 바뀌어 소용없다). 아래 에러 범례에도 없는 코드라 원인 파악이 오래 걸린다.
          case "${BACKEND_URL}" in
            https://*) ;;
            *)
              # 값 자체는 찍지 않는다(시크릿). 형식만 알린다.
              echo "::error::BACKEND_URL 시크릿은 https://로 시작하고 끝에 슬래시가 없어야 합니다. 예: https://<서비스>.onrender.com"
              exit 1
              ;;
          esac

          # 어느 cron이 울렸는지는 github.event.schedule에만 있다(수동 실행이면 빈 문자열).
          # **모르는 값에 기본값을 주지 않는다.** cron 한 줄을 늘리고 여기 분기를 빠뜨리면
          # 매 실행이 한쪽 시장군만 수집하고 다른 쪽은 조용히 비는데, 그건 실패가 아니라
          # "없는 데이터"라 잡이 초록으로 끝난다. 여기서 죽으면 Actions가 빨개진다.
          if [ -z "${EVENT_SCHEDULE}" ]; then
            SCHEDULE="${INPUT_SCHEDULE}"
            # `required: true` + choice라 GitHub이 빈 값을 통과시키지 않으므로 지금은 닿지 않는
            # 분기다. 그래도 남겨 둔다 — required가 빠지거나 입력이 text로 바뀌는 날, 기본값 없는
            # 값이 빈 문자열로 URL에 실려 400이 나는 대신 여기서 이유를 밝히고 죽는다.
            if [ -z "${SCHEDULE}" ]; then
              echo "::error::수동 실행인데 schedule 입력이 비었습니다."
              exit 1
            fi
          else
            case "${EVENT_SCHEDULE}" in
              "30 21 * * 1-5") SCHEDULE="US" ;;
              "30 8 * * 1-5")  SCHEDULE="ASIA" ;;
              *)
                echo "::error::처음 보는 cron 스케줄입니다: '${EVENT_SCHEDULE}'. on.schedule에 줄을 추가했다면 이 case에도 시장군을 넣어주세요."
                exit 1
                ;;
            esac
          fi

          echo "schedule=${SCHEDULE}"

          # 무료 인스턴스가 잠들어 있으면 첫 요청이 30~90초 걸리거나 502가 난다.
          # 재시도가 안전한 이유는 수집이 멱등하기 때문이다 — 같은 (지수, 거래일, CLOSE)이면
          # OverseasIndexCollectService가 기존 행을 덮어쓴다.
          #
          # -o/-w로 본문과 상태를 분리해 받는다. --fail을 쓰면 4xx/5xx에서 본문이 버려져
          # 왜 실패했는지(502 KIS 응답 이상인지 400 schedule 오타인지) 알 수 없게 된다.
          # 해외 수집은 부분 실패(9건 중 1건 실패)가 HTTP 200으로 나오므로, 본문의
          # failures 배열이 유일한 단서다.
          #
          # --max-time은 전체가 아니라 "시도 1회당" 상한이다. 그래서 최악 소요는
          # 120초 x 4회 시도 + 20초 x 3회 대기 = 540초(9분)이고, 이 값은 위
          # timeout-minutes(12)보다 작아야 한다 — 두 숫자는 따로 노는 값이 아니다.
          # 지수가 3종이 아니라 최대 6종이라 한 번의 수집이 국내보다 오래 걸린다는 점도
          # 이 예산 안에 들어 있다(지수마다 KIS 호출이 하나씩이다).
          #
          # set -e 아래에서 명령 치환 대입은 그 종료 코드를 그대로 물려받는다. curl은 HTTP
          # 응답만 오면 4xx/5xx라도 0으로 끝나지만 전송 계층 실패(7 연결거부 / 28 타임아웃 /
          # 6 DNS / 35 TLS)에서는 0이 아니다. 그대로 두면 이 워크플로가 견디려고 만들어진
          # 바로 그 상황 — 콜드 인스턴스가 매 시도 --max-time을 넘기는 경우 — 에서 여기서
          # 죽어 요약도 에러 범례도 남지 않는다. 그래서 실패를 삼키고 센티널을 세운다.
          # curl 자신도 전송 실패 시 %{http_code}로 000을 찍으므로 000 = "HTTP 응답 없음".
          HTTP_CODE=$(curl -sS -X POST \
            "${BACKEND_URL}/api/internal/scheduler/index/overseas?schedule=${SCHEDULE}" \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 20 \
            --retry-all-errors \
            -o response.json \
            -w '%{http_code}') || HTTP_CODE="000"

          echo "HTTP ${HTTP_CODE}"

          # 이 저장소는 공개다. 토큰은 어디에도 찍지 않는다 — 요약은 영구 보존되고
          # 로그와 달리 GitHub의 시크릿 마스킹에 기대는 것도 위험하다.
          {
            echo "### 해외 지수 수집 (${SCHEDULE})"
            echo ""
            echo "HTTP \`${HTTP_CODE}\`"
            echo ""
            echo '```json'
            cat response.json 2>/dev/null || echo '(본문 없음)'
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::해외 지수 수집 실패 (HTTP ${HTTP_CODE}). 400=schedule 값 오타(US|ASIA) / 500=수집 대상 설정 없음(market-index.overseas) / 502=KIS 응답 이상 또는 전 지수 이름 불일치 / 503=SCHEDULER_TOKEN 미설정 / 000=백엔드 응답 없음(콜드 스타트·네트워크)"
            exit 1
          fi

          # 200이어도 부분 실패일 수 있다 — OverseasIndexCollectService는 지수 하나가 터져도
          # 나머지를 살리려고 예외 대신 요약으로 돌려준다. 부분 실패를 빨갛게 만들지는 않는다
          # (지수 하나가 흔들렸다고 매일 잡이 실패로 보이면 아무도 안 보게 된다).
          # 대신 **애너테이션으로 남긴다**.
          #
          # 본문을 grep으로 재해석하지 않는다: 직렬화 형식이 조금만 바뀌어도(들여쓰기·필드 순서)
          # 조용히 아무것도 안 잡는 가드가 되어, 없느니만 못하다. 그래서 진짜 JSON 파서로 읽는다.
          python3 - response.json <<'PY'
          import json, sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  body = json.load(f)
          except (OSError, ValueError) as e:
              print(f"::warning::HTTP 200인데 응답 본문을 읽지 못했습니다({e}). 부분 실패 여부를 확인할 수 없습니다.")
              raise SystemExit(0)

          failed = body.get("failed") or 0
          failures = body.get("failures") or []
          names = body.get("names") or {}

          # **건수를 stdout에도 남긴다.** 잡 요약($GITHUB_STEP_SUMMARY)은 사람이 UI를 열어야만
          # 보이고 REST API로는 못 읽는다 — 로그에도 체크런 output에도 안 실린다(둘 다 null).
          # 그래서 이 줄이 없으면 "요청 수가 조용히 줄어든 경우"를 아무도 못 가른다:
          # 설정 누락이나 구버전 배포로 requested가 6→3이 돼도 3/3 전량 성공이라 아래 경고가
          # 안 뜨고, 잡은 초록으로 끝난다. **실패가 아니라 대상이 사라지는 쪽**의 결함이다.
          print(
              f"수집 결과: schedule={body.get('schedule')} requested={body.get('requested')} "
              f"collected={body.get('collected')} inserted={body.get('inserted')} "
              f"updated={body.get('updated')} failed={failed}"
          )

          # **names를 한 줄씩 찍는다 — 이게 이 워크플로에서 가장 값어치 있는 출력이다.**
          # 해외 9종 중 실측으로 확인된 것은 SPX·.DJI·HK#HS 셋뿐이고 나머지 여섯은 KIS 마스터
          # 파일에서 읽었을 뿐이다. 코드를 잘못 고르면 안전장치는 전부 통과한다 — 엉뚱한 지수의
          # 응답도 그 지수 기준으로는 내부적으로 일관돼서 값끼리의 검사에 걸릴 것이 없다.
          # 그래서 KIS가 돌려준 이름(hts_kor_isnm)과의 대조가 유일한 방어이고, 배포 후 코드
          # 검증의 주 수단이다. 잡 요약에도 실리지만 그건 UI를 열어야 보이므로 로그에도 남긴다.
          if names:
              print("KIS가 돌려준 이름(코드 대조용):")
              for code in sorted(names):
                  print(f"  {code} = {names[code]}")
          else:
              print("::warning::응답에 names가 없습니다 — 지수 코드가 맞는지 대조할 수단이 사라졌습니다.")

          # 수집 대상이 0이면 서버가 500을 주므로 여기까지 오지 않는다. 그래도 확인해 둔다 —
          # 그 계약이 바뀌는 날 이 워크플로가 "0건 성공"을 초록으로 넘기지 않게.
          if not body.get("requested"):
              print("::warning::수집 대상이 0건입니다 — market-index.overseas 설정을 확인하세요.")

          if failed or failures:
              reasons = " | ".join(str(x) for x in failures) or "(사유 없음)"
              print(f"::warning::해외 지수 {failed}건 수집 실패 (수집 {body.get('collected')}/{body.get('requested')}): {reasons}")
          PY
