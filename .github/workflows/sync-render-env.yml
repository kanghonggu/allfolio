name: Sync Render Environment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Trigger a Render deploy after syncing env vars
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-render-env.yml"
      - "allfolio-backend/**"
      - "docs/GITHUB_SECRETS_ENV.md"
      - "render.yaml"

permissions:
  contents: read

concurrency:
  group: render-env-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-render-env:
    name: Sync Render env vars and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_AFTER_SYNC: ${{ github.event_name == 'push' || inputs.deploy == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load GitHub Secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ALLFOLIO_JWT_SECRET: ${{ secrets.ALLFOLIO_JWT_SECRET }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          ACCESS_TOKEN_MINUTES: ${{ secrets.ACCESS_TOKEN_MINUTES }}
          REFRESH_TOKEN_DAYS: ${{ secrets.REFRESH_TOKEN_DAYS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          KAFKA_ENABLED: ${{ secrets.KAFKA_ENABLED }}
        run: |
          set -euo pipefail

          {
            echo "RENDER_API_KEY=$RENDER_API_KEY"
            echo "RENDER_SERVICE_ID=$RENDER_SERVICE_ID"
            echo "SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE"
            echo "DB_URL=$DB_URL"
            echo "DB_USER=$DB_USER"
            echo "DB_PASS=$DB_PASS"
            echo "ALLFOLIO_JWT_SECRET=$ALLFOLIO_JWT_SECRET"
            echo "APP_ENCRYPTION_KEY=$APP_ENCRYPTION_KEY"
            echo "ACCESS_TOKEN_MINUTES=$ACCESS_TOKEN_MINUTES"
            echo "REFRESH_TOKEN_DAYS=$REFRESH_TOKEN_DAYS"
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            echo "KAFKA_ENABLED=$KAFKA_ENABLED"
          } >> "$GITHUB_ENV"

      - name: Sync env vars to Render
        env:
          RENDER_ENV_KEYS: >-
            SPRING_PROFILES_ACTIVE
            DB_URL
            DB_USER
            DB_PASS
            ALLFOLIO_JWT_SECRET
            APP_ENCRYPTION_KEY
            ACCESS_TOKEN_MINUTES
            REFRESH_TOKEN_DAYS
            ALLOWED_ORIGINS
            KAFKA_ENABLED
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "RENDER_API_KEY and RENDER_SERVICE_ID are required." >&2
            exit 1
          fi

          for key in $RENDER_ENV_KEYS; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "$key is required." >&2
              exit 1
            fi

            json="$(jq -n --arg value "$value" '{value: $value}')"
            curl --fail-with-body --silent --show-error --request PUT \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --data "$json" >/dev/null

            echo "Synced env var: $key"
          done

      - name: Trigger Render deploy
        if: env.DEPLOY_AFTER_SYNC == 'true'
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --data '{"clearCache":"do_not_clear"}' >/dev/null

          echo "Triggered Render deploy."
