apiVersion: 1

datasources:
  # Prometheus — 메트릭
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  # Loki — 로그
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Prometheus와 로그를 연결 (같은 시간대에 메트릭+로그 동시 조회)
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "traceId=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
