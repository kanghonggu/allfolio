version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: allfolio-postgres
    environment:
      POSTGRES_DB: allfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # 데이터 영속성을 위한 볼륨
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allfolio-network

  # Kafka (KRaft 모드 — Zookeeper 없음)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: allfolio-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - allfolio-network

  # Redis (시세 캐시, PnL 캐시)
  redis:
    image: redis:7-alpine
    container_name: allfolio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - allfolio-network

  # backend-app (거래 API, PnL 계산)
  backend-app:
    build:
      context: ./allfolio-backend
      dockerfile: backend-app/Dockerfile
    container_name: allfolio-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/allfolio
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      ALLFOLIO_JWT_SECRET: ${ALLFOLIO_JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "30"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - allfolio-network

  # market-data (WebSocket 시세 수신 → Kafka)
  market-data:
    build:
      context: ./allfolio-backend
      dockerfile: market-data/Dockerfile
    container_name: allfolio-market-data
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/allfolio
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_BOOTSTRAP: kafka:9092
      BINANCE_WS_ENABLED: "true"
      BINANCE_SYMBOLS: BTCUSDT,ETHUSDT
      KIS_WS_ENABLED: "false"
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - allfolio-network

  # User 서비스 (Spring Boot)
  user-service:
    image: allfolio/user-service:latest
    container_name: allfolio-user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/allfolio
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - allfolio-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local

networks:
  allfolio-network:
    driver: bridge
