events {
  worker_connections 1024;
}

http {
  # 업스트림 정의
  upstream backend  { server backend:8090; }
  upstream keycloak { server keycloak:8080; }
  upstream grafana  { server grafana:3000; }

  # HTTP → HTTPS 리디렉트
  server {
    listen 80;
    server_name _;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS — API 서버
  server {
    listen 443 ssl;
    server_name api.allfolio.me;

    ssl_certificate     /etc/letsencrypt/live/api.allfolio.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.allfolio.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Access-Control-Allow-Origin  "https://allfolio.vercel.app" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Id" always;

    # SSE 스트리밍 엔드포인트
    location /api/ai/chat {
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass             http://backend;
      proxy_set_header       Host $host;
      proxy_set_header       X-Real-IP $remote_addr;
      proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
      proxy_read_timeout     300s;
      proxy_buffering        off;
      proxy_cache            off;
      chunked_transfer_encoding on;
    }

    location / {
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass         http://backend;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # HTTPS — Grafana 모니터링
  server {
    listen 443 ssl;
    server_name monitor.allfolio.me;

    ssl_certificate     /etc/letsencrypt/live/monitor.allfolio.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.allfolio.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass         http://grafana;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }
  }

  # HTTPS — Keycloak 인증 서버
  server {
    listen 443 ssl;
    server_name auth.allfolio.me;

    # api.allfolio.me와 SAN으로 같이 발급된 인증서 사용
    ssl_certificate     /etc/letsencrypt/live/api.allfolio.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.allfolio.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass            http://keycloak;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto https;
      proxy_buffer_size     128k;
      proxy_buffers         4 256k;
      proxy_busy_buffers_size 256k;
    }
  }
}
