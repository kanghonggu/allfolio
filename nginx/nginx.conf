events {
  worker_connections 1024;
}

http {
  # 업스트림 정의
  upstream backend  { server backend:8090; }
  upstream keycloak { server keycloak:8080; }
  upstream grafana  { server grafana:3000; }

  # HTTP → HTTPS 리디렉트
  server {
    listen 80;
    server_name _;

    # Let's Encrypt 인증 경로
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS — API 서버
  server {
    listen 443 ssl;
    server_name api.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/api.${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # CORS — Vercel 프론트엔드 허용
    add_header Access-Control-Allow-Origin  "https://${FRONTEND_DOMAIN}" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Id" always;

    location / {
      if ($request_method = OPTIONS) { return 204; }
      proxy_pass         http://backend;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # HTTPS — Grafana 모니터링 (내부 접근 권장)
  server {
    listen 443 ssl;
    server_name monitor.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/monitor.${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass         http://grafana;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # WebSocket (Grafana Live)
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }
  }

  # HTTPS — Keycloak 인증 서버
  server {
    listen 443 ssl;
    server_name auth.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/auth.${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass            http://keycloak;
      proxy_set_header      Host $host;
      proxy_set_header      X-Real-IP $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto https;
      proxy_buffer_size     128k;
      proxy_buffers         4 256k;
      proxy_busy_buffers_size 256k;
    }
  }
}
