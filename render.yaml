services:
  - type: web
    name: allfolio-api
    runtime: docker
    plan: free
    dockerfilePath: ./allfolio-backend/backend-app/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: ALLFOLIO_JWT_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: KAFKA_ENABLED
        value: "false"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: ALLOWED_ORIGINS
        sync: false
      # FX 환율 수집 (AF-99). Upbit KRW-USDT가 주 소스, Bithumb이 폴백.
      - key: FX_SCHEDULER_ENABLED
        value: "true"
      # 수집이 3주기 연속 실패했을 때만 쓰이는 최후 상수
      - key: FX_USDT_KRW_FALLBACK
        value: "1400"
